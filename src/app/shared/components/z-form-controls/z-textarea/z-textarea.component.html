<div [formGroup]="group">
    <p-floatLabel>
        <textarea pInputTextarea
            [class]="styleClass"
            [formControlName]="control"
            [appShowValidationTooltip]="validationMessage"
            [rows]="rows"
            [class.p-filled]="group.get(control)?.value">
        </textarea>
        <label>{{ label }}</label>
    </p-floatLabel>
</div>
