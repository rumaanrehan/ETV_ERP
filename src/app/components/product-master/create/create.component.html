<ng-template #pageHeaderActionTemplate>
  <button
    class="btn btn-primary btn-page-header"
    (click)="onClickPageHeaderAddButton()"
  >
    <i class="pi pi-arrow-left"></i>&nbsp;Back
  </button>
</ng-template>

<div class="col-xl-12 page-content px-1 py-0">
  <div class="col-xl-9 card m-auto shadow-sm">
    <div
      class="card-header bg-primary text-white d-flex justify-content-between align-items-center px-3"
    >
      <h5 class="m-0 flex-grow-1 text-white">
        {{ isEditMode ? "Edit Product" : "Add New Product" }}
      </h5>
    </div>

    <div class="card-body page-content-scrollable px-3 py-0">
      <!-- Reduced padding -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
        <!-- Product Details Section -->
        <h6 class="section-title">Product Details</h6>

        <div class="row g-3 custom-column-gap">
          <!-- <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'productCode'"
              [label]="formConfig.productCode.label"
            ></z-inputtext>
          </div> -->

          <div class="col-md-6">
            <z-span
              [text]="form.get('productCode')?.value"
              [label]="formConfig.productCode.label"
            ></z-span>
          </div>


          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'productName'"
              [label]="formConfig.productName.label"
            ></z-inputtext>
          </div>

          <div class="col-md-6">
            <z-select
              [group]="form"
              [control]="'CategoryID'"
              [label]="formConfig.CategoryID.label"
              [optionLabel]="'CategoryName'"
              [optionValue]="'CategoryID'"
              [options]="CategoryList"
            >
            </z-select>
          </div>
          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'productDescription'"
              [label]="formConfig.productDescription.label"
            ></z-inputtext>
          </div>
        </div>

        <!-- Pricing & Tax Section -->
        <h6 class="section-title mt-4">Pricing & Tax</h6>
        <div class="row g-3 custom-column-gap">
          <div class="col-md-6">
            <z-inputnumber
              [group]="form"
              [control]="'unitPrice'"
              [label]="formConfig.unitPrice.label"
            ></z-inputnumber>
          </div>
          <div class="col-md-6">
            <z-inputnumber
              [group]="form"
              [control]="'costPrice'"
              [label]="formConfig.costPrice.label"
            ></z-inputnumber>
          </div>
          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'taxSlabId'"
              [label]="formConfig.taxSlabId.label"
            ></z-inputtext>
          </div>
          <div class="col-md-6">
            <z-inputnumber
              [group]="form"
              [control]="'purTaxRate'"
              [label]="formConfig.purTaxRate.label"
            ></z-inputnumber>
          </div>
        </div>

        <!-- Stock & Inventory Section -->
        <h6 class="section-title mt-4">Stock & Inventory</h6>
        <div class="row g-3 custom-column-gap">
          <div class="col-md-6">
            <z-inputnumber
              [group]="form"
              [control]="'reorderLevel'"
              [label]="formConfig.reorderLevel.label"
            ></z-inputnumber>
          </div>
          <div class="col-md-6">
            <z-inputnumber
              [group]="form"
              [control]="'reorderQty'"
              [label]="formConfig.reorderQty.label"
            ></z-inputnumber>
          </div>
          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'unit'"
              [label]="formConfig.unit.label"
            ></z-inputtext>
          </div>
          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'manufacturerId'"
              [label]="formConfig.manufacturerId.label"
            ></z-inputtext>
          </div>

          <!-- Add Measurement Unit here -->
          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'measurementUnit'"
              [label]="formConfig.measurementUnit.label"
            ></z-inputtext>
          </div>

          <!-- hsCode -->
          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'hsCode'"
              [label]="formConfig.hsCode.label"
            ></z-inputtext>
          </div>
        </div>

        <!-- Measurements & Packaging Section -->
        <h6 class="section-title mt-4">Measurements & Packaging</h6>
        <div class="row g-3 custom-column-gap">
          <div class="col-md-6">
            <z-inputnumber
              [group]="form"
              [control]="'netWeight'"
              [label]="formConfig.netWeight.label"
            ></z-inputnumber>
          </div>
          <div class="col-md-6">
            <z-inputnumber
              [group]="form"
              [control]="'grossWeight'"
              [label]="formConfig.grossWeight.label"
            ></z-inputnumber>
          </div>
          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'Dimension'"
              [label]="formConfig.Dimension.label"
            ></z-inputtext>
          </div>
          <div class="col-md-6">
            <z-inputtext
              [group]="form"
              [control]="'packagingType'"
              [label]="formConfig.packagingType.label"
            ></z-inputtext>
          </div>
        </div>

        <!-- Active Status -->
        <div class="form-group mt-4">
          <z-inputswitch
            [group]="form"
            [control]="'isActive'"
            [label]="formConfig.isActive.label"
          ></z-inputswitch>
        </div>

        <!-- Action Buttons -->
        <!-- <div class="fixed-action-buttons d-flex justify-content-end mt-4">
          <button
            type="submit"
            class="btn btn-primary me-2"
            [disabled]="isSubmitted"
          >
            
            {{ isEditMode ? "Update" : "Save" }}
          </button>
          <button
            type="button"
            class="btn btn-secondary"
            (click)="closeSidebar()"
          >
            Cancel
          </button>
        </div> -->
      </form>
    </div>
  </div>
  
</div>
<div class="page-action-panel">
  <div class="col-xl-4"></div>
  <div class="col-xl-4"></div>
  <div class="col-xl-4">
    <div class="col-xl-3 px-1">
      <button
        type="submit"
        class="btn btn-md btn-primary w-100"
        (click)="onSubmit()"
      >
        {{ isEditMode ? "Update" : "Save" }}
      </button>
    </div>
    <div class="col-xl-3 px-1">
      <button
        type="submit"
        class="btn btn-md btn-primary w-100"
        (click)="resetForm()"
      >
        Reset
      </button>
    </div>
  </div>
</div>
