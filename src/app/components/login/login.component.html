<div class="container-fluid d-flex justify-content-center align-items-center vh-100 login-bg">
  <div class="col-lg-3 col-md-6 col-sm-8 p-4 login-card">
    <div class="col-5 signin-text-container">
      <div class="signin-text">
        Sign in to IEMS
      </div>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="mb-3">
        <input type="text" id="Username" formControlName="Username" placeholder="Username" />
      </div>
      <div class="mb-3">
        <input [type]="showPassword ? 'text' : 'password'" id="Password" formControlName="Password"
          placeholder="Password" (keydown)="checkCapsLock($event)" />
      </div>
      <button type="submit" class="btn-submit w-100 text-white">Sign in</button>
    </form>
    <div class="mt-3">
      <p class="m-0 text-center text-danger">{{errorMessage}}</p>
    </div>
  </div>
</div>
