<div class="custom-login-page">
  <div class="login-container">
    <div class="login-form">
      <h2 class="title">Import Export System</h2>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">

        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" placeholder="Enter your username" formControlName="Username"/>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Enter your password" formControlName="Password" (keydown)="checkCapsLock($event)" />
        </div>

        <button class="btn-login" type="submit">
          Login
        </button>
        
      </form>
    </div>
      <div class="login-banner">
        <img src="./../../../assets/images/authentication/Onboarding.png" alt="ERP Illustration" />
      </div>
  </div>
</div>
