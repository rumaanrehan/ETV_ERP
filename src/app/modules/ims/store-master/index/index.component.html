 <!-- Page Header Action Button Template -->
<ng-template #pageHeaderActionTemplate>
    <button class="btn btn-primary btn-page-header" (click)="onClickPageHeaderAddButton()"><i class="pi pi-plus"></i>&nbsp;Add Store</button>
</ng-template>

<!-- Index Table Component -->
<div style="overflow-x: auto">
    <z-datatable [tableDef]="tableDef" (lazyLoad)="onIndexTableLazyLoad($event)"></z-datatable>
</div>

<!-- Table Column Custom Template -->
 <ng-template #storeCodeTemplate let-row>
    <span class="table-action-link" (click)="onClickEditDetails(row.StoreID, row.ActiveStatus)" style="cursor: pointer;">{{ row.StoreCode }}</span>
</ng-template>

<ng-template #storeMasterActiveStatusTemplate let-row>
    <span class="table-row-status">
        <i class="pi pi-circle-fill text-{{ row.ActiveStatus ? 'success' : 'danger' }}"></i>
        {{ row.ActiveStatus ? 'Active'  : 'Inactive' }}
    </span>
</ng-template>

<ng-template #actionColTemplate let-row>
    <div class="d-flex justify-content-end">
        <span class="btn btn-icon btn-sm btn-{{row.ActiveStatus ? 'danger' : 'success'}}-transparent btn-delete-reactivate" (click)="onClickDeleteReactivate(row)"><i class="pi pi-{{row.ActiveStatus ? 'trash' : 'undo'}}"></i></span>
    </div>
</ng-template>

<app-create (closeSidebarEvent)="onCloseSidebar()"></app-create>
