 <app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem'">
    <div sidebarHeader>
        <h5 class="text-white">Store Master</h5>
    </div>
     <div sidebarContent>
        <form class="form-sidebar" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
            <div class="col-xl-12 form-group">
                <z-span [text]="form.get('StoreCode')?.value" [label]="formConfig.StoreCode.label"></z-span>
            </div>
            <div class="col-xl-12 form-group">
                <z-inputtext [group]="form" [control]="'StoreName'" [label]="formConfig.StoreName.label" [validationMessage]="formConfig.StoreName.error"></z-inputtext>
            </div>
            <div class="col-xl-12 row align-items-center form-group form-control-group justify-content-end">
                <div class="col-xl-12">
                <z-checkbox [group]="form" [control]="'CanIssueToStores'" [label]="formConfig.CanIssueToStores.label"></z-checkbox>
                </div>
            </div>
            <div class="col-xl-12 row align-items-center form-group form-control-group justify-content-end">
                <div class="col-xl-12">
                <z-checkbox [group]="form" [control]="'CanIssueToPatients'" [label]="formConfig.CanIssueToPatients.label"></z-checkbox>
                </div>
            </div>
            <div class="col-xl-12 row align-items-center form-group form-control-group justify-content-end">
                <div class="col-xl-12">
                <z-checkbox [group]="form" [control]="'CanRaiseIndent'" [label]="formConfig.CanRaiseIndent.label"></z-checkbox>
                </div>
            </div>
            <div class="col-xl-12 form-group">
                <z-select [group]="form" [control]="'InwardAcceptType'" [label]="formConfig.InwardAcceptType.label" [validationMessage]="formConfig.InwardAcceptType.error" 
                [options]="AcceptInwardStockList" [optionLabel]="'Text'" [optionValue]="'iValue'">
                </z-select>
            </div>
        </form>
    </div>
    <div sidebarFooter>
        <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
            <div class="col-md-6 pe-1">
                <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()" [disabled]="form.invalid">
                    {{ isEditMode ? "Update" : "Save" }}
                </button>
            </div>
            <div class="col-md-6 ps-1">
                <button type="button" class="btn btn-md btn-light w-100" (click)="closeSidebar()">Cancel</button>
            </div>
        </div>
    </div>
</app-form-sidebar>
