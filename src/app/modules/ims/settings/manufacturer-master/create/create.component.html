<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem manufacturer-create-sidebar'">
  <div sidebarHeader>
    <h5 class="manufacturer-create-title">{{ isEditMode ? 'Edit Manufacturer' : 'Create Manufacturer' }}</h5>
  </div>
  <div sidebarContent>
    <form class="manufacturer-create-form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="simple-form">
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.ManufacturerCode.label }}:</label>
          <div class="simple-control">
            <div class="simple-static">{{ form.get('ManufacturerCode')?.value || 'NEW' }}</div>
          </div>
        </div>

        <div class="simple-field">
          <label class="simple-label">{{ formConfig.ManufacturerName.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" [control]="'ManufacturerName'" [label]="''"
              [validationMessage]="formConfig.ManufacturerName.error"></z-inputtext>
          </div>
        </div>

        <div class="simple-field">
          <label class="simple-label">{{ formConfig.ShortCode.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" [control]="'ShortCode'" [label]="''"
              [validationMessage]="formConfig.ShortCode.error"></z-inputtext>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div sidebarFooter>
    <div class="manufacturer-create-footer">
      <button type="button" class="simple-btn" (click)="closeSidebar()">Cancel</button>
      <button type="submit" class="simple-btn is-active" (click)="onSubmit()"
        [disabled]="isSubmitted || !activeStatus || form.invalid">
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>
    </div>
  </div>
</app-form-sidebar>
