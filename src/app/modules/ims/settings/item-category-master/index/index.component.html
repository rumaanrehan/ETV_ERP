<!-- Page Header Action Button Template -->
<ng-template #pageHeaderActionTemplate>
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-primary btn-page-header btn-md shadow-sm btn-add-item-category" (click)="onClickPageHeaderAddButton()">
      <i class="pi pi-plus"></i>&nbsp; Create
    </button>

    <div class="btn-group view-switcher-group" role="group">
      <button class="btn btn-outline-primary view-switcher-btn" [class.active]="viewType() === 'card'"
        (click)="toggleView('card')">
        <i class="pi pi-th-large"></i> Card
      </button>
      <button class="btn btn-outline-primary view-switcher-btn" [class.active]="viewType() === 'table'"
        (click)="toggleView('table')">
        <i class="pi pi-list"></i> Table
      </button>
    </div>
  </div>
</ng-template>

<div class="col-xl-12 index-page-content">
  @if (viewType() === 'card') {
    <app-item-category-dataview [filterForm]="filterForm" [sortingForm]="sortingForm"
      (editDetails)="onClickEditDetails($event)" (deleteReactivate)="onClickDeleteReactivate($event)">
    </app-item-category-dataview>
  } @else {
    <app-item-category-gridview [filterForm]="filterForm"
      (editDetails)="onClickEditDetails($event)" (deleteReactivate)="onClickDeleteReactivate($event)">
    </app-item-category-gridview>
  }
</div>

<app-create (closeSidebarEvent)="onCloseSidebar()"></app-create>
