
<ng-template #pageHeaderActionTemplate>
  <button class="btn btn-primary btn-sm" (click)="onClickPageHeaderAddButton()"> <i class="bi bi-arrow-left-circle" style="vertical-align: bottom; margin-right: 5px;"></i>Back</button>
</ng-template>

<form [formGroup]="form" (ngSubmit)="onSubmit(ServiceCategoryMappedList,TestGroupMapping)" autocomplete="off">
  <div class="row">
    <div class="col-xl-3"></div>
    <div class="col-xl-6 form-group mt-3">
      <z-select [group]="form" [control]="'TestGroupID'" [label]="formConfig.TestGroupID.label" [validationMessage]="formConfig.TestGroupID.error" (onChange)="onTestGroupChange()"
                [options]="TestGroupList" [optionLabel]="'TestGroupName'" [optionValue]="'TestGroupID'">
      </z-select>
    </div>
  </div>
  <div class="col-xl-3"></div>

              [targetList]="ServiceCategoryMappedList"
              [sourceHeader]="'All Service Category'"
              [targetHeader]="'Mapped Category'"
              [itemName]="'ServiceCategoryName'"
              [showActionButton]="false"
              (onMoveToSource)="onMoveToSource($event)"

<div class="row m-1">
  <div class="col-xl-5"></div>
  <div class="col-xl-2">
    <button type="submit" class="btn btn-md btn-primary w-100 p-1" [disabled]="(!ServiceCategoryMappedList.length && !isItemMovedToSource) || isSubmitted" (click)="onSubmit(ServiceCategoryMappedList,TestGroupMapping)">Update</button>
  </div>
  <div class="col-xl-5"></div>
</div>
