<ng-template #pageHeaderActionTemplate>
  <button class="btn btn-primary btn-page-header" (click)="onClickPageHeaderBackButton()"><i
      class="pi pi-arrow-left"></i>&nbsp;Back</button>
</ng-template>
<div class="col-xl-12">
  <div class="col-xl-12 page-content">
    <div class="col-xl-12 page-content-scrollable card no-border m-0">
      <div class="card-body p-0">
        <form class="" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
          <div class="col-xl-12 card m-auto mb-2">
            <div class="card-body form-horizontal d-flex flex-wrap">
              <div class="col-xl-3 ">
                <div class="col-xl-4 form-group ps-0">
                  <z-span [text]="form.get('BookingNo')?.value" [label]="formConfig.BookingNo.label"></z-span>
                </div>
                <div class="col-xl-4 form-group">
                  <z-span [text]="form.get('BookingDate')?.value" [label]="formConfig.BookingDate.label"></z-span>
                </div>
                <div class="col-xl-4 form-group">
                  <z-span [text]="form.get('BookingTime')?.value" [label]="formConfig.BookingTime.label"></z-span>
                </div>
              </div>
              <div class="col-xl-7"></div>
              <div class="col-xl-2">
                <z-autocomplete
                  [controlDef]="patientAutoCompleteDef"
                  (onSearch)="loadPatient($event)"
                  (onSelect)="onSelect_Patient($event)"
                  (onClear)="onClear_RegistrationNo()">
                </z-autocomplete>
              </div>
              <div class="col-xl-4 form-group">
                <z-span [text]="form.get('PatientName')?.value" [label]="formConfig.PatientName.label"></z-span>
              </div>
              <div class="col-xl-4">
                <div class="col-xl-6 form-group m-auto">
                  <z-span [text]="form.get('AgeSex')?.value" [label]="formConfig.AgeSex.label"></z-span>
                </div>
              </div>
              <div class="col-xl-4 form-group">
                <z-autocomplete
                    [controlDef]="consultantAutoCompleteDef"
                    (onSearch)="loadConsultant($event)"
                    (onSelect)="onSelect_Consultant($event)"
                    (onClear)="onClear_Consultant()">
                  </z-autocomplete>
              </div>
              <div class="col-xl-4 form-group">
                <z-span [text]="form.get('RegistrationDateTime')?.value"
                  [label]="formConfig.RegistrationDateTime.label"></z-span>
              </div>
              <div class="col-xl-4 form-group">
                <z-span [text]="form.get('PlanName')?.value" [label]="formConfig.PlanName.label"></z-span>
              </div>
              <div class="col-xl-4 form-group">
                <z-span [text]="form.get('PatientLocation')?.value"
                  [label]="formConfig.PatientLocation.label"></z-span>
              </div>
            </div>
          </div>
          <div class="col-xl-12 card m-auto mb-2">
            <div class="card-body form-horizontal d-flex flex-wrap">
              <div class="col-xl-4 form-group">
                <div class="input-group">
                  <div class="input-group-select">
                    <z-select [group]="form" [control]="'SearchBy'" [label]="formConfig.SearchBy.label"
                      [showClear]="false" [options]="serviceSearchByList" [optionLabel]="'Text'" [optionValue]="'iValue'"
                      (onChange)="onChange_ServiceSearchBy()">
                    </z-select>
                  </div>
                  <z-autocomplete
                    [controlDef]="serviceAutoCompleteDef"
                    (onSearch)="loadService($event)"
                    (onSelect)="onSelect_Service($event)">
                  </z-autocomplete>
                </div>
              </div>
              <div class="col-xl-12">
                <z-table [tableDef]="tableDef"></z-table>
              </div>
              <div class="col-xl-1 form-group">
                <z-span [text]="noOfServices.toString()" [label]="'No. of Service'"></z-span>
              </div>
              <div class="col-xl-9"></div>
              <div class="col-xl-2 form-group">
                <div class="input-group">
                  <span class="input-group-text"><i class="pi pi-indian-rupee"></i></span>
                  <z-span class='flex-grow-1' [text]="totalAmounts.toString()"
                    [label]="'Total Amounts'" styleClass="text-end"></z-span>
                  <span class="input-group-text">.00</span>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="page-action-panel">
    <div class="col-xl-4">

    </div>
    <div class="col-xl-4">

    </div>
    <div class="col-xl-4">
      <div class="col-xl-3 px-1 ">
        <div class="form-control-group">
          <!-- <z-checkbox [group]="form" [control]="'IsAutoPrint'"
              [label]="'Print'">
            </z-checkbox> -->
        </div>
      </div>
      <!-- <div class="col-xl-3 px-1" *ngIf="!isEditMode">
        <z-checkbox [group]="form" [control]="'IsAutoPrint'"
          [label]="formConfig.IsAutoPrint.label"></z-checkbox>
      </div> -->
      <div class="col-xl-3 px-1">
        <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()" [disabled]="isSubmitted">{{
          isEditMode ? 'Print' : 'Save' }}</button>
      </div>
      <div class="col-xl-3 px-1">
        <button type="button" class="btn btn-md btn-primary w-100" (click)="resetForm()"> {{ isEditMode ? 'PrintLabel' :
          'Reset'}}</button>
      </div>
    </div>
  </div>
</div>

<!-- Service Dialog -->
<z-dialog [isVisible]="isVisibleServiceDialog" [header]="'Service Details'" styleClass="w-40rem">
  <div dialogContent>
    <form [formGroup]="serviceForm!">
      <div class="col-xl-12 mt-1 form-group">
        <z-span [text]="serviceForm.get('ServiceName')?.value" [label]="serviceFormConfig.ServiceName.label"></z-span>
      </div>
      <div class="col-xl-12 form-group">
        <z-span [text]="serviceForm.get('ServiceCategoryName')?.value"
          [label]="serviceFormConfig.ServiceCategoryName.label"></z-span>
      </div>
      <div class="col-xl-12 form-group">
        <z-span [text]="serviceForm.get('InPackage')?.value" [label]="serviceFormConfig.InPackage.label"></z-span>
      </div>
      <div class="col-xl-12 form-group">
        <div class="input-group">
          <span class="input-group-text" id="addon-wrapping"><i class="pi pi-indian-rupee"></i></span>
          <z-inputnumber class='flex-grow-1' [group]="serviceForm" control="ServiceAmount"
            [label]="serviceFormConfig.ServiceAmount.label"
            [validationMessage]="serviceFormConfig.ServiceAmount.error"></z-inputnumber>
          <span class="input-group-text" id="addon-wrapping">.00</span>
        </div>
      </div>
      <div class="page-action-panel">
        <div class="col-xl-4">
  
        </div>
        <div class="col-xl-4">
  
        </div>
        <div class="col-xl-4">
          <div class="col-xl-3 px-1">
            <button type="submit" class="btn btn-md btn-primary w-100" (click)="onServiceAdd()">Add</button>
          </div>
          <div class="col-xl-3 px-1">
            <button type="submit" class="btn btn-md btn-primary w-100" (click)="onClickCancel()">Cancel</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</z-dialog>

<!-- Templates -->
<ng-template #inPackageTemplate let-row>
  {{ row.InPackage ? 'Yes' : 'No' }}
</ng-template>
<ng-template #actionColTemplate let-row>
  <div class="d-flex justify-content-end" *ngIf="!row.StatusText || row.StatusText !== 'CANCELLED'">
    <span class="btn btn-icon btn-sm btn-danger-transparent btn-delete-reactivate"
      (click)="onClickDelete(row)"><i class="pi pi-trash"></i></span>
  </div>
</ng-template>
