<form [formGroup]="form" (ngSubmit)="onSubmit(ConsultantUnitMappedList,ConsultantUnitMapping)" autocomplete="off">
  <div class="row">
    <div class="col-xl-3"></div>
    <div class="col-xl-6 card card-body">
      <div class="row">
        <div class="col-xl-6 form-group">
          <z-select [group]="form" [control]="'DepartmentID'" [label]="formConfig.DepartmentID.label" [validationMessage]="formConfig.DepartmentID.error" (onChange)="onDepartmentChange()"
                    [options]="DepartmentList" [optionLabel]="'DepartmentName'" [optionValue]="'DepartmentID'">
          </z-select>
        </div>
        <div class="col-xl-6 form-group">
          <z-select [group]="form" [control]="'ConsultantUnitID'" [label]="formConfig.ConsultantUnitID.label" [validationMessage]="formConfig.ConsultantUnitID.error" (onChange)="onConsultantMasterChange()"
                    [options]="ConsultantMasterList" [optionLabel]="'ConsultantUnitName'" [optionValue]="'ConsultantUnitID'">
          </z-select>
        </div>
      </div>
    </div>
    <div class="col-xl-3"></div>
  </div>

<z-picklist [sourceList]="ConsultantUnitList"
            [targetList]="ConsultantUnitMappedList"
            [sourceHeader]="'All Consultant'"
            [targetHeader]="'Mapped Consultant'"
            [itemName]="'ConsultantName'" 
            [showActionButton]="true"
            [disableActionButton]="!selectedTarget || isItemMovedToTarget || isItemMovedToSource || isSubmitted"
            [actionButtonLabel]="'Make Unit Head'">
</z-picklist>

</form>
<div class="row m-1">
  <div class="col-xl-5"></div>
  <div class="col-xl-2">
    <button type="submit" class="btn btn-md btn-primary w-100 p-1" [disabled]="(!ConsultantUnitMappedList.length && !isItemMovedToSource) || isSubmitted" (click)="onSubmit(ConsultantUnitMappedList,ConsultantUnitMapping)">Update</button>
  </div>
  <div class="col-xl-5"></div>
</div>
