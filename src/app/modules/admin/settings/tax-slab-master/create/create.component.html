<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem tax-slab-create-sidebar'">
  <div sidebarHeader>
    <h5 class="tax-slab-create-title">{{ isEditMode ? 'Edit Tax Slab' : 'Create Tax Slab' }}</h5>
  </div>
  <div sidebarContent>
    <form class="tax-slab-create-form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="simple-form">
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.TaxSlabCode.label }}:</label>
          <div class="simple-control">
            <div class="simple-static">{{ form.get('TaxSlabCode')?.value || 'NEW' }}</div>
          </div>
        </div>

        <div class="simple-field">
          <label class="simple-label">{{ formConfig.TaxTypeID.label }}:</label>
          <div class="simple-control">
            <z-select [group]="form" [control]="'TaxTypeID'" [label]="''"
              [validationMessage]="formConfig.TaxTypeID.error" [optionLabel]="'TaxTypeName'" [optionValue]="'TaxTypeID'"
              [options]="taxTypeList">
            </z-select>
          </div>
        </div>

        <div class="simple-field">
          <label class="simple-label">{{ formConfig.TaxSlabName.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" control="TaxSlabName" [label]="''"
              [validationMessage]="formConfig.TaxSlabName.error"></z-inputtext>
          </div>
        </div>

        <div class="simple-field">
          <label class="simple-label">{{ formConfig.TaxRate.label }}:</label>
          <div class="simple-control">
            <z-inputnumber [group]="form" [control]="'TaxRate'" [min]="0" [max]="100" [label]="''"
              [validationMessage]="formConfig.TaxRate.error"></z-inputnumber>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div sidebarFooter>
    <div class="tax-slab-create-footer">
      <button type="button" class="simple-btn" (click)="closeSidebar()">Cancel</button>
      <button type="submit" class="simple-btn is-active" (click)="onSubmit()"
        [disabled]="isSubmitted || !ActiveStatus || form.invalid">
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>
    </div>
  </div>
</app-form-sidebar>
