<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem'">
  <div sidebarHeader>
    <h5 class="text-white">State Master</h5>
  </div>
  <div sidebarContent>
    <form class="form-sidebar" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="col-xl-12 form-group">
        <z-inputtext [group]="form" [control]="'StateCode'" [label]="formConfig.StateCode.label"></z-inputtext>
      </div>
      <div class="col-xl-12 form-group">
        <z-select [group]="form" [control]="'CountryID'" [label]="formConfig.CountryID.label"
                  [options]="CountryList" [optionLabel]="'CountryName'" [optionValue]="'CountryID'">
        </z-select>
      </div>
      <div class="col-xl-12 form-group">
        <z-inputtext [group]="form" [control]="'StateName'" [label]="formConfig.StateName.label" [validationMessage]="formConfig.StateName.error"></z-inputtext>
      </div>
      <div class="row">
        <div class="col-xl-6 form-group">
          <z-inputtext [group]="form" [control]="'StateISOCode'" [label]="formConfig.StateISOCode.label" [validationMessage]="formConfig.StateISOCode.error"></z-inputtext>
        </div>
        <div class="col-xl-6 form-group">
          <z-inputtext [group]="form" [control]="'StateGSTCode'" [label]="formConfig.StateGSTCode.label" [validationMessage]="formConfig.StateGSTCode.error"></z-inputtext>
        </div>
      </div>
      <div class="col-xl-12 form-group">
        <z-inputswitch [group]="form" [control]="'IsDefault'" [label]="formConfig.IsDefault.label"></z-inputswitch>
      </div>
    </form>
  </div>
  <div sidebarFooter>
    <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
      <div class="col-md-6 pe-1">
        <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()" [disabled]="isSubmitted || !ActiveStatus">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
      <div class="col-md-6 ps-1">
        <button type="button" class="btn btn-md btn-light w-100" (click)="closeSidebar()">Cancel</button>
      </div>
    </div>
  </div>
</app-form-sidebar>
