<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem'">
  <div sidebarHeader>
    <h5 class="text-white">Tax Slab Master</h5>
  </div>
  <div sidebarContent>
    <form class="form-sidebar" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="col-xl-12 form-group">
        <z-inputtext [group]="form" control="TaxSlabCode" [label]="formConfig.TaxSlabCode.label"></z-inputtext>
      </div>
      <div class="col-xl-12 form-group">
        <z-select [group]="form" [control]="'TaxType'" [label]="formConfig.TaxType.label" [validationMessage]="formConfig.TaxType.error"
                  [options]="TaxTypeList" [optionLabel]="'name'" [optionValue]="'Value'">
        </z-select>
      </div>
      <div class="col-xl-12 form-group">
        <z-inputtext [group]="form" control="TaxSlabName" [label]="formConfig.TaxSlabName.label" [validationMessage]="formConfig.TaxSlabName.error"></z-inputtext>
      </div>
      <div class="col-xl-6 form-group">
        <z-inputnumber [group]="form" [control]="'TaxRate'" [min]="0" [max]="100" [label]="formConfig.TaxRate.label" [validationMessage]="formConfig.TaxRate.error"></z-inputnumber>
      </div>
    </form>
  </div>
  <div sidebarFooter>
    <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
      <div class="col-md-6 pe-1">
        <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()" [disabled]="isSubmitted || !ActiveStatus">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
      <div class="col-md-6 ps-1">
        <button type="button" class="btn btn-md btn-light w-100" (click)="closeSidebar()">Cancel</button>
      </div>
    </div>
  </div>
</app-form-sidebar>
