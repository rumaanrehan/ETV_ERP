<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem'">
    <div sidebarHeader>
        <h5 class="text-white">Employee Type</h5>
    </div>
    <div sidebarContent>
        <form class="form-sidebar" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
            <div class="col-xl-12 form-group">
                <z-span [text]="form.get('EmployeeTypeCode')?.value" [label]="formConfig.EmployeeTypeCode.label"></z-span>
            </div>
            <!-- <div class="col-xl-12 form-group">
              <z-select [group]="form" [control]="'EmployeeTypeID'" [label]="formConfig.EmployeeTypeID.label"
              [validationMessage]="formConfig.EmployeeTypeID.error" [optionLabel]="'EmployeeTypeName'" [optionValue]="'EmployeeTypeID'" [options]="EmployeeTypeList">
              </z-select>
            </div> -->
            <div class="col-xl-12 form-group">
                <z-inputtext [group]="form" [control]="'EmployeeTypeName'" [label]="formConfig.EmployeeTypeName.label"></z-inputtext>
            </div>
             <div class="col-xl-12 form-group form-check">
     <input
    type="checkbox"  class="form-check-input"  id="isAllowedOvertime"
     formControlName="IsAllowedOvertime">
     <label class="form-check-label" for="isAllowedOvertime">
    {{ formConfig.IsAllowedOvertime.label }}
  </label>
</div>
        </form>
    </div>
    <div sidebarFooter>
        <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
            <div class="col-md-6 pe-1">
                <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()" [disabled]="isSubmitted || !activeStatus">
                    {{ isEditMode ? "Update" : "Save" }}
                </button>
            </div>
            <div class="col-md-6 ps-1">
                <button type="button" class="btn btn-md btn-light w-100" (click)="closeSidebar()">Cancel</button>
            </div>
        </div>
    </div>
</app-form-sidebar>
