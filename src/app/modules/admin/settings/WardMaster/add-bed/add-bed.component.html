<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem'">
  <div sidebarHeader>
    <h5 class="text-white">Add Bed</h5>
  </div>
  <div sidebarContent>
    <form class="form-sidebar" [formGroup]="form" (ngSubmit)="onSubmit()"  autocomplete="off">
      <div class="col-xl-12 form-group">
        <z-inputnumber [group]="form" [control]="'WardBed_TotalBeds'" [label]="formConfig.WardBed_TotalBeds.label" [validationMessage]="formConfig.WardBed_TotalBeds.error"></z-inputnumber>
      </div>
      <div class="col-xl-12 form-group">
        <z-datepicker [group]="form" control="WardBed_EffectiveFromDate" [label]="formConfig.WardBed_EffectiveFromDate.label" [validationMessage]="formConfig.WardBed_EffectiveFromDate.error"></z-datepicker>
      </div>
    </form>
  </div>
  <div sidebarFooter>
    <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
      <div class="col-md-6 pe-1">   
        <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()" [disabled]="isSubmitted">Save</button> 
      </div>
      <div class="col-md-6 ps-1">
        <button type="button" class="btn btn-md btn-light w-100" (click)="closeSidebar()">Cancel</button>
      </div>
    </div>
  </div>
</app-form-sidebar>
