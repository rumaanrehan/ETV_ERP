<ng-template #menuNameTemplate let-row>
  <span class="table-action-link" (click)="onClickEditDetails(row.MenuID, row.ActiveStatus)">
    {{ row.MenuName }}
  </span>
</ng-template>

<ng-template #isDeveloperOnlyTemplate let-row>
  <span class="badge rounded-pill {{ row.IsDeveloperOnly ? 'bg-outline-success' : 'bg-outline-dark' }}">
    {{ row.IsDeveloperOnly ? 'Yes' : 'No' }}
  </span>
</ng-template>

<ng-template #menuActiveStatusTemplate let-row>
  <span class="grid-status-pill"
    [ngStyle]="{ backgroundColor: row.ActiveStatus ? '#22c55e' : '#ef4444' }">
    {{ row.ActiveStatus ? 'Active' : 'Inactive' }}
  </span>
</ng-template>

<ng-template #actionColTemplate let-row>
  <div class="d-flex justify-content-end">
    <button type="button" class="grid-action-btn" (click)="onClickDeleteReactivate(row)">
      <i class="pi pi-trash"></i>
    </button>
  </div>
</ng-template>

<z-datatable [tableDef]="tableDef" (lazyLoad)="onIndexTableLazyLoad($event)" (resetFormEmitter)="onResetForm($event)">
</z-datatable>
