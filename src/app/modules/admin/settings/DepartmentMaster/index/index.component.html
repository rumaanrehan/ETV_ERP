<!-- Page Header Action Button Template -->
<!-- Page Header Action Button Template -->
<ng-template #pageHeaderActionTemplate>
  <button class="btn btn-primary btn-page-header" (click)="OnClickPageHeaderAddButton()"><i class="pi pi-plus"></i>&nbsp;Add Department Master</button>
</ng-template>
  
<!-- Index Table Component -->
<div style="overflow-x: auto">
  <z-datatable [tableDef]="tableDef" (lazyLoad)="onIndexTableLazyLoad($event)"></z-datatable>
</div>

<ng-template #DepartmentCodeTemplate let-row>
  <span class="table-action-link" (click)="OnClickEditDetails(row.DepartmentID)" style="cursor: pointer;">{{ row.DepartmentCode }}</span>
</ng-template>
<ng-template #DepartmentActiveStatusTemplate let-row>
  <span class="table-row-status">
    <i class="pi pi-circle-fill text-{{ row.ActiveStatus ? 'success' : 'danger' }}"></i>
    {{ row.ActiveStatus ? 'Active' : 'Inactive' }}
  </span>
</ng-template>

<ng-template #actionColTemplate let-row>
  <div class="hstack gap-2 fs-15 justify-content-end">
    <span class="btn btn-icon btn-sm btn-danger-transparent rounded-pill" (click)="onClickDeleteReactivate(row)"><i class="ri-delete-bin-line"></i></span>
  </div>
</ng-template>

<app-create (closeSidebarEvent)="onCloseSidebar()"></app-create>
