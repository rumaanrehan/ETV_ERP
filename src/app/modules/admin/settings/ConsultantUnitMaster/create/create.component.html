<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem'">
  <div sidebarHeader>
    <h5 class="text-white">Consultant Unit Master</h5>
  </div>
  <div sidebarContent>
    <form class="form-sidebar" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="col-xl-12 form-group">
        <z-inputtext [group]="form" [control]="'ConsultantUnitCode'" [label]="formConfig.ConsultantUnitCode.label"></z-inputtext>
      </div>
      <div class="col-xl-12 form-group">
        <z-inputtext [group]="form" [control]="'ConsultantUnitName'" [label]="formConfig.ConsultantUnitName.label" [validationMessage]="formConfig.ConsultantUnitName.error"></z-inputtext>
      </div>
      <div class="col-xl-12 form-group">
        <z-select [group]="form" [control]="'DepartmentID'" [label]="formConfig.DepartmentID.label" [validationMessage]="formConfig.DepartmentID.error"
                  [options]="DepartmentsList" [optionLabel]="'DepartmentName'" [optionValue]="'DepartmentID'">
        </z-select>
      </div>
      <div class="col-xl-12 form-group">
        <z-datepicker [group]="form" [control]="'dtEffectiveFromDate'" [label]="formConfig.dtEffectiveFromDate.label" [validationMessage]="formConfig.dtEffectiveFromDate.error"></z-datepicker>
      </div>
    </form>
  </div>
  <div sidebarFooter>
    <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
      <div class="col-md-6 pe-1">
        <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()" [disabled]="isSubmitted || !ActiveStatus">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
      <div class="col-md-6 ps-1">
        <button type="button" class="btn btn-md btn-light w-100" (click)="closeSidebar()">Cancel</button>
      </div>
    </div>
  </div>
</app-form-sidebar>
