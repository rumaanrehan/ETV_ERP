<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem'">
  <div sidebarHeader>
    <h5 class="text-white">Room Type Master</h5>
  </div>
  <div sidebarContent>
    <form class="form-sidebar" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="col-xl-12 form-group">
        <z-inputtext [group]="form" [control]="'RoomTypeCode'" [label]="formConfig.RoomTypeCode.label"></z-inputtext>
      </div>
      <div class="col-xl-12 form-group">
        <z-inputtext [group]="form" [control]="'RoomTypeName'" [label]="formConfig.RoomTypeName.label" [validationMessage]="formConfig.RoomTypeName.error"></z-inputtext>
      </div>
      <div class="col-xl-12 form-group">
        <z-select [group]="form" [control]="'RateTypeID'" [label]="formConfig.RateTypeID.label" [validationMessage]="formConfig.RateTypeID.error"
                  [options]="RateTypeList" [optionLabel]="'RateTypeName'" [optionValue]="'RateTypeID'">
        </z-select>
      </div>
      <div *ngIf="!isEditMode" class="col-xl-12 form-group">
        <div class="input-group">
          <span class="input-group-text" id="addon-wrapping"><i class="pi pi-indian-rupee"></i></span>
          <z-inputnumber class='flex-grow-1' [group]="form" control="RoomRate" [label]="formConfig.RoomRate.label" [validationMessage]="formConfig.RoomRate.error"></z-inputnumber>
          <span class="input-group-text" id="addon-wrapping">.00</span>
        </div>
      </div>
    </form>
  </div>
  <div sidebarFooter>
    <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
      <div class="col-md-6 pe-1">
        <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()" [disabled]="isSubmitted || !ActiveStatus">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
      <div class="col-md-6 ps-1">
        <button type="button" class="btn btn-md btn-light w-100" (click)="closeSidebar()">Cancel</button>
      </div>
    </div>
  </div>
</app-form-sidebar>
