<ng-template #pageHeaderActionTemplate>
  <button class="btn btn-primary btn-page-header" (click)="onClickPageHeaderAddButton()">
    <i class="pi pi-plus"></i>&nbsp;Add Payment
  </button>
</ng-template>

<div style="overflow-x: auto">
  <z-datatable [tableDef]="tableDef"(lazyLoad)="onIndexTableLazyLoad($event)"></z-datatable>
</div>

<ng-template #paymentNoTemplate let-row>
  <span
    class="table-action-link"
    (click)="onClickEditDetails(row.PaymentID, row.IsCanceled)"
    style="cursor: pointer;">
    {{ row.PaymentNo }}
  </span>
</ng-template>

<ng-template #statusTemplate let-row>
  <span class="table-row-status">
    <i class="pi pi-circle-fill text-{{ row.IsCanceled ? 'danger' : 'success' }}"></i>
    {{ row.IsCanceled ? 'Inactive' : 'Active' }}
  </span>
</ng-template>

<ng-template #actionColTemplate let-row>
  <div class="d-flex justify-content-end">
    <span
      class="btn btn-icon btn-sm btn-{{ row.IsCanceled ? 'success' : 'danger' }}-transparent btn-delete-reactivate"
      (click)="onClickDeleteReactivate(row)">
      <i class="pi pi-{{ row.IsCanceled ? 'undo' : 'trash' }}"></i>
    </span>
  </div>
</ng-template>


<app-create (closeSidebarEvent)="onCloseSidebar()"></app-create>
