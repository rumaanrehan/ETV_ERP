<div class="col-xl-12 index-page-content">
  <z-datatable [tableDef]="tableDef" (lazyLoad)="onIndexTableLazyLoad($event)" (resetFormEmitter)="onResetForm($event)">
  </z-datatable>
</div>

<ng-template #paymentTermCodeTemplate let-row>
  <span class="table-action-link cursor-pointer" (click)="onClickEditDetails(row)">{{ row.PaymentTermCode }}</span>
</ng-template>

<ng-template #paymentTermActiveStatusTemplate let-row>
  <span class="table-row-status">
    <i class="pi pi-circle-fill text-{{ row.ActiveStatus ? 'success' : 'danger' }}"></i>
    {{ row.ActiveStatus ? 'Active' : 'Inactive' }}
  </span>
</ng-template>

<ng-template #actionColTemplate let-row>
  <div class="d-flex justify-content-end">
    <span class="btn btn-icon btn-sm btn-{{row.ActiveStatus ? 'danger' : 'success'}}-transparent btn-delete-reactivate"
      (click)="onClickDeleteReactivate(row)">
      <i class="pi pi-{{row.ActiveStatus ? 'trash' : 'undo'}}"></i>
    </span>
  </div>
</ng-template>
