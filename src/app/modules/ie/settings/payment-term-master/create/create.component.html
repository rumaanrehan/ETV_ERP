<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem payment-term-create-sidebar'">
  <div sidebarHeader>
    <h5 class="text-white">Payment Term Master</h5>
  </div>

  <div sidebarContent>
    <form class="pt-create-form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="simple-form">

        <!-- Payment Term Code -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.PaymentTermCode.label }}:</label>
          <div class="simple-control">
            <div class="simple-static">
              {{ form.get('PaymentTermCode')?.value || 'NEW' }}
            </div>
          </div>
        </div>

        <!-- Payment Term Name -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.PaymentTermName.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" control="PaymentTermName" [label]="''"
              [validationMessage]="formConfig.PaymentTermName.error">
            </z-inputtext>
          </div>
        </div>

        <!-- Description -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.Description.label }}:</label>
          <div class="simple-control">
            <z-textarea [group]="form" control="Description" [label]="''" [autoResize]="true" [rows]="1"
              [validationMessage]="formConfig.Description.error">
            </z-textarea>
          </div>
        </div>

      </div>
    </form>
  </div>

  <div sidebarFooter>
    <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
      <div class="pt-create-footer">
        <button type="button" class="simple-btn" (click)="closeSidebar()">Cancel</button>
        <button type="submit" class="simple-btn is-active" [disabled]="isSubmitted || !activeStatus" (click)="onSubmit()">
          {{ isEditMode ? "Update" : "Save" }}
        </button>
      </div>
    </div>
  </div>
</app-form-sidebar>
