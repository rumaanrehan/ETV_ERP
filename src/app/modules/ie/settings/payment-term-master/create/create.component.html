<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem'">
    <div sidebarHeader>
        <h5 class="text-white">Payment Term Master</h5>
    </div>
    <div sidebarContent>
        <form class="form-sidebar" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
            <div class="col-xl-12 form-group">
                <z-span [text]="form.get('PaymentTermCode')?.value" [label]="formConfig.PaymentTermCode.label"></z-span>
            </div>
            <div class="col-xl-12 form-group">
                <z-inputtext [group]="form" [control]="'PaymentTermName'" [label]="formConfig.PaymentTermName.label"
                    [validationMessage]="formConfig.PaymentTermCode.error">
                </z-inputtext>
            </div>
            <div class="col-xl-12 form-group">
                <z-textarea [group]="form" [control]="'Description'" [label]="formConfig.Description.label"
                    [validationMessage]="formConfig.Description.error">
                </z-textarea>
            </div>
        </form>
    </div>
    <div sidebarFooter>
        <div class="col-xl-12 d-grid mt-4 d-flex align-items-center">
            <div class="col-md-6 pe-1">
                <button type="submit" class="btn btn-md btn-primary w-100" [disabled]="isSubmitted || !activeStatus" (click)="onSubmit()">
                    {{ isEditMode ? "Update" : "Save" }}
                </button>
            </div>
            <div class="col-md-6 ps-1">
                <button type="button" class="btn btn-md btn-light w-100" (click)="closeSidebar()">Cancel</button>
            </div>
        </div>
    </div>
</app-form-sidebar>
