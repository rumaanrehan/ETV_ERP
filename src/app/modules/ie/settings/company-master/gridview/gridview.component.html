<div class="col-xl-12 index-page-content">
  <z-datatable [tableDef]="tableDef" (lazyLoad)="onIndexTableLazyLoad($event)" (resetFormEmitter)="onResetForm($event)">
  </z-datatable>
</div>

<ng-template #companyCodeTemplate let-row>
  <span class="table-action-link">{{ row.CompanyCode }}</span>
</ng-template>

<ng-template #companyTypeTemplate let-row>
  <span class="table-row-status">
    {{ row.CompanyTypeID == 1 ? 'Client' : 'Vendor' }}
  </span>
</ng-template>

<ng-template #companyActiveStatusTemplate let-row>
  <span class="grid-status-pill" [ngStyle]="{ backgroundColor: row.ActiveStatus ? '#22c55e' : '#ef4444' }">
    {{ row.ActiveStatus ? 'Active' : 'Inactive' }}
    </span>
</ng-template>

<ng-template #actionColTemplate let-row>
  <div class="d-flex justify-content-end">
    <button type="button" class="pt-action-btn" (click)="$event.stopPropagation(); onClickDeleteReactivate(row)">
      <i class="pi pi-{{row.ActiveStatus ? 'trash' : 'undo'}}"></i>
    </button>
  </div>
</ng-template>
