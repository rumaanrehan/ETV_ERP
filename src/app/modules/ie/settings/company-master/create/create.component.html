<app-form-sidebar [isVisible]="isFormSidebarVisible" [styleClass]="'w-30rem contact-create-sidebar'">

  <div sidebarHeader>
    <h5 class="contact-create-title">Contact</h5>
  </div>

  <div sidebarContent>
    <form class="contact-create-form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">

      <div class="simple-form">

        <!-- Company Code -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.CompanyCode.label }}:</label>
          <div class="simple-control">
            <div class="simple-static">
              {{ form.get('CompanyCode')?.value || 'NEW' }}
            </div>
          </div>
        </div>

        <!-- Company Name -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.CompanyName.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" control="CompanyName" [label]="''"
              [validationMessage]="formConfig.CompanyName.error">
            </z-inputtext>
          </div>
        </div>

        <!-- Company Type -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.CompanyTypeID.label }}:</label>
          <div class="simple-control">
            <z-select [group]="form" control="CompanyTypeID" [label]="''"
              [validationMessage]="formConfig.CompanyTypeID.error"
              [options]="vendorTypeList" optionLabel="Text" optionValue="iValue"
              (onChange)="onChange_CompanyType($event)">
            </z-select>
          </div>
        </div>

        <!-- Country -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.CountryID.label }}:</label>
          <div class="simple-control">
            <z-select [group]="form" control="CountryID" [label]="''"
              [validationMessage]="formConfig.CountryID.error"
              [options]="countryList" optionLabel="CountryName" optionValue="CountryID"
              (click)="loadStates()">
            </z-select>
          </div>
        </div>

        <!-- State -->
        <div class="simple-field" *ngIf="form.get('CountryID')?.value !== null">
          <label class="simple-label">{{ formConfig.StateID.label }}:</label>
          <div class="simple-control">
            <z-select [group]="form" control="StateID" [label]="''"
              [validationMessage]="formConfig.StateID.error"
              [options]="stateList" optionLabel="StateName" optionValue="StateID">
            </z-select>
          </div>
        </div>

        <!-- Contact Name -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.CompanyContactName.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" control="CompanyContactName" [label]="''"
              [validationMessage]="formConfig.CompanyContactName.error">
            </z-inputtext>
          </div>
        </div>

        <!-- Phone -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.CompanyPhoneNo.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" control="CompanyPhoneNo" [label]="''"
              [validationMessage]="formConfig.CompanyPhoneNo.error">
            </z-inputtext>
          </div>
        </div>

        <!-- Email -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.CompanyEmailID.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" control="CompanyEmailID" [label]="''"
              [validationMessage]="formConfig.CompanyEmailID.error">
            </z-inputtext>
          </div>
        </div>

        <!-- Conditional fields -->
        <ng-container *ngIf="!isClientCompany">
          <div class="simple-field">
            <label class="simple-label">{{ formConfig.ImportLicenseNo.label }}:</label>
            <div class="simple-control">
              <z-inputtext [group]="form" control="ImportLicenseNo" [label]="''"></z-inputtext>
            </div>
          </div>

          <div class="simple-field">
            <label class="simple-label">{{ formConfig.GSTNo.label }}:</label>
            <div class="simple-control">
              <z-inputtext [group]="form" control="GSTNo" [label]="''"></z-inputtext>
            </div>
          </div>

          <div class="simple-field">
            <label class="simple-label">{{ formConfig.TANNo.label }}:</label>
            <div class="simple-control">
              <z-inputtext [group]="form" control="TANNo" [label]="''"></z-inputtext>
            </div>
          </div>

          <div class="simple-field">
            <label class="simple-label">{{ formConfig.PANNo.label }}:</label>
            <div class="simple-control">
              <z-inputtext [group]="form" control="PANNo" [label]="''"></z-inputtext>
            </div>
          </div>
        </ng-container>

        <div class="simple-field" *ngIf="isClientCompany">
          <label class="simple-label">{{ formConfig.CRNumber.label }}:</label>
          <div class="simple-control">
            <z-inputtext [group]="form" control="CRNumber" [label]="''"></z-inputtext>
          </div>
        </div>

        <!-- Billing Address -->
        <div class="simple-field">
          <label class="simple-label">{{ formConfig.BillingAddress.label }}:</label>
          <div class="simple-control">
            <z-textarea [group]="form" control="BillingAddress" [label]="''"></z-textarea>
          </div>
        </div>

        <!-- Checkbox -->
        <div class="simple-field">
          <label class="simple-label"></label>
          <div class="simple-control">
            <z-checkbox [group]="form" control="IsShippingAddressSameAsBillingAddress" [label]="formConfig.IsShippingAddressSameAsBillingAddress.label">
            </z-checkbox>
          </div>
        </div>

        <!-- Shipping -->
        <div class="simple-field" *ngIf="!form.get('IsShippingAddressSameAsBillingAddress')?.value">
          <label class="simple-label">{{ formConfig.ShippingAddress.label }}:</label>
          <div class="simple-control">
            <z-textarea [group]="form" control="ShippingAddress" [label]="''"></z-textarea>
          </div>
        </div>

      </div>

    </form>
  </div>

  <div sidebarFooter>
    <div class="contact-create-footer">
      <button type="button" class="simple-btn" (click)="closeSidebar()">Cancel</button>
      <button type="submit" class="simple-btn is-active"
        (click)="onSubmit()" [disabled]="isSubmitted || !activeStatus">
        {{ isEditMode ? "Update" : "Save" }}
      </button>
    </div>
  </div>

</app-form-sidebar>
