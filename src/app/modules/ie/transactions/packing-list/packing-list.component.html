<div formDialogHeader class="col-xl-12 px-0">
  <div class="packing-header-standalone" [class.is-selected]="form.get('ExportOrderID')?.value">
    <div class="packing-header-field" [class.is-selected]="form.get('ExportOrderID')?.value">
      <label class="packing-header-label">{{ formConfig.ExportOrderNo.label }}:</label>
      <div class="packing-header-control">
        <z-autocomplete class="packing-header-autocomplete" [controlDef]="exportOrderAutoCompleteDef"
          [allowEmptySearch]="form.get('ExportOrderID')?.value ? false : true" [readonly]="isEditMode"
          (onSearch)="loadExportOrder($event)" (onSelect)="onSelect_ExportOrder($event)"
          (onClear)="onClear_ExportOrder()">
        </z-autocomplete>
      </div>
      <div class="packing-header-actions" *ngIf="form.get('ExportOrderID')?.value">
        <div class="toolbar">
          <button type="button" class="toolbar-btn is-active" [disabled]="isSubmitted" (click)="onSubmit()">
            <span>{{ isEditMode ? "Update" : "Save" }}</span>
          </button>
          <button type="button" class="toolbar-btn" (click)="closeDialogBox()">
            <span>Cancel</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div formDialogContent class="packing-dialog-content" *ngIf="form.get('ExportOrderID')?.value">
  <div class="col-12 packing-layout-shell">
    <div class="col-xl-12 page-content-scrollable packing-layout-scroll">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="col-xl-12 card m-auto mb-2 order-info-sticky top-border-0">
          <div class="card-body">
            <div class="horizontal-form">
              <div class="order-info-grid">
                <div class="box-detail-field">
                  <label class="box-detail-label">{{ formConfig.ExportOrderPackingListNo.label }}:</label>
                  <div class="box-detail-control">
                    <z-span [text]="form.get('ExportOrderPackingListNo')?.value" [label]="''"></z-span>
                  </div>
                </div>
                <div class="box-detail-field">
                  <label class="box-detail-label">{{ formConfig.CustomerName.label }}:</label>
                  <div class="box-detail-control">
                    <z-span [text]="form.get('CustomerName')?.value" [label]="''"></z-span>
                  </div>
                </div>
                <div class="box-detail-field">
                  <label class="box-detail-label">{{ formConfig.PackingIdentityID.label }}:</label>
                  <div class="box-detail-control">
                    <z-select [group]="form" [control]="'PackingIdentityID'" [label]="''" [optionLabel]="'Text'"
                      [optionValue]="'iValue'" [options]="packingIdentityList"></z-select>
                  </div>
                </div>
                <div class="box-detail-field">
                  <label class="box-detail-label">{{ formConfig.NoOfBox.label }}:</label>
                  <div class="box-detail-control">
                    <z-span [text]="form.get('NoOfBox')?.value" [label]="''"></z-span>
                  </div>
                </div>
                <div class="box-detail-field order-info-actions" *ngIf="form.get('ExportOrderID')?.value">
                  <label class="box-detail-label">&nbsp;</label>
                  <div class="box-detail-control">
                    <div class="table-add-row">
                      <button type="button" class="simple-btn" (click)="addBox()">
                        <i class="pi pi-plus" aria-hidden="true"></i>
                        <span>Add Box</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div formArrayName="BoxList">
          <div class="col-xl-12 card m-auto mb-2 box-card" *ngFor="let box of boxListArray.controls; let i = index"
            [formGroupName]="i">
            <div class="card-header box-header">
              <button type="button" class="box-toggle" (click)="toggleBox(i)">
                <span class="box-toggle-title">Box {{ i + 1 }}</span>
                <i class="pi" [ngClass]="boxCollapsed[i] ? 'pi-chevron-down' : 'pi-chevron-up'"></i>
              </button>
              <div class="box-header-actions">
                <button type="button" class="simple-btn" (click)="removeBox(i)">
                  <i class="pi pi-minus" aria-hidden="true"></i>
                  <span>Remove Box</span>
                </button>
              </div>
            </div>

            <div class="card-body" *ngIf="!boxCollapsed[i]">
              <div class="horizontal-form">
                <div class="box-details-grid">
                  <div class="box-detail-field">
                    <label class="box-detail-label">{{ formConfig.BoxList.items.NoOfProduct.label }}:</label>
                    <div class="box-detail-control">
                      <z-span [text]="box.get('NoOfProduct')?.value" [label]="''"></z-span>
                    </div>
                  </div>
                  <div class="box-detail-field">
                    <label class="box-detail-label">{{ formConfig.BoxList.items.BoxLength.label }}:</label>
                    <div class="box-detail-control">
                      <z-inputnumber [group]="box" [control]="'BoxLength'" [label]="''"
                        [validationMessage]="formConfig.BoxList.items.PackedDateTime.error"></z-inputnumber>
                    </div>
                  </div>
                  <div class="box-detail-field">
                    <label class="box-detail-label">{{ formConfig.BoxList.items.BoxWidth.label }}:</label>
                    <div class="box-detail-control">
                      <z-inputnumber [group]="box" [control]="'BoxWidth'" [label]="''"
                        [validationMessage]="formConfig.BoxList.items.PackedDateTime.error"></z-inputnumber>
                    </div>
                  </div>
                  <div class="box-detail-field">
                    <label class="box-detail-label">{{ formConfig.BoxList.items.BoxHeight.label }}:</label>
                    <div class="box-detail-control">
                      <z-inputnumber [group]="box" [control]="'BoxHeight'" [label]="''"
                        [validationMessage]="formConfig.BoxList.items.PackedDateTime.error"></z-inputnumber>
                    </div>
                  </div>
                  <div class="box-detail-field">
                    <label class="box-detail-label">{{ formConfig.BoxList.items.BoxWeight.label }}:</label>
                    <div class="box-detail-control">
                      <z-inputnumber [group]="box" [control]="'BoxWeight'"
                        [label]="formConfig.BoxList.items.BoxWeight.label"
                        [validationMessage]="formConfig.BoxList.items.BoxWeight.error"
                        [readonly]="true"></z-inputnumber>
                    </div>
                    <div class="box-detail-field">
                      <label class="box-detail-label">{{ formConfig.BoxList.items.BoxGrossWeight.label }}:</label>
                      <div class="box-detail-control">
                        <z-inputnumber [group]="box" [control]="'BoxGrossWeight'" [label]="''"
                          [validationMessage]="formConfig.BoxList.items.PackedDateTime.error"></z-inputnumber>
                      </div>
                    </div>
                    <div class="box-detail-field">
                      <label class="box-detail-label">{{ formConfig.BoxList.items.PackedBy.label }}:</label>
                      <div class="box-detail-control">
                        <z-select [group]="box" [control]="'PackedBy'" [label]="''"
                          [validationMessage]="formConfig.BoxList.items.PackedDateTime.error"
                          [optionLabel]="'EmployeeName'" [optionValue]="'EmployeeID'"
                          [options]="employeeList"></z-select>
                      </div>
                    </div>
                    <div class="box-detail-field">
                      <label class="box-detail-label">{{ formConfig.BoxList.items.PackedDateTime.label }}:</label>
                      <div class="box-detail-control">
                        <z-datepicker [group]="box" [control]="'PackedDateTime'" [label]="''"
                          [validationMessage]="formConfig.BoxList.items.PackedDateTime.error"></z-datepicker>
                      </div>
                    </div>
                    <div class="box-detail-field">
                      <label class="box-detail-label">{{ formConfig.BoxList.items.InspectedBy.label }}:</label>
                      <div class="box-detail-control">
                        <z-select [group]="box" [control]="'InspectedBy'" [label]="''"
                          [validationMessage]="formConfig.BoxList.items.PackedDateTime.error"
                          [optionLabel]="'EmployeeName'" [optionValue]="'EmployeeID'"
                          [options]="employeeList"></z-select>
                      </div>
                    </div>
                    <div class="box-detail-field">
                      <label class="box-detail-label">{{ formConfig.BoxList.items.InspectedDateTime.label }}:</label>
                      <div class="box-detail-control">
                        <z-datepicker [group]="box" [control]="'InspectedDateTime'" [label]="''"
                          [validationMessage]="formConfig.BoxList.items.InspectedDateTime.error"></z-datepicker>
                      </div>
                    </div>
                  </div>
                  <div class="simple-field simple-field-table">
                    <div class="simple-control">
                      <z-table [tableDef]="productTableDefs[i]"></z-table>
                    </div>
                  </div>
                  <div class="table-add-row">
                    <button type="button" class="simple-btn" (click)="addProductRow(i)">
                      <i class="pi pi-plus" aria-hidden="true"></i>
                      <span>Add line</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Packing List Box Related Templates Start -->
<ng-template #serialNoColTemplate let-row let-rowIndex="index">
  {{rowIndex + 1}}
</ng-template>

<ng-template #productSelectColTemplate let-row let-rowIndex="index">
  <z-select [group]="getProductList(row.__boxIndex).at(rowIndex)" [control]="'ProductID'" [label]="''"
    [validationMessage]="formConfig.BoxList.items.ProductList.items.ProductName.error"
    (onChange)="onChange_Product($event, row.__boxIndex, rowIndex)"
    [options]="getAvailableProducts(row.__boxIndex, rowIndex)" [optionLabel]="'ProductName'"
    [optionValue]="'ProductID'">
  </z-select>
</ng-template>

<ng-template #packedQtyColTemplate let-row let-rowIndex="index">
  <z-inputnumber [group]="getProductList(row.__boxIndex).at(rowIndex)"
    (onChange)="onChange_PackedQty(row.__boxIndex, rowIndex)" [control]="'PackedQty'" [label]="''"
    [validationMessage]="formConfig.BoxList.items.ProductList.items.PackedQty.error">
  </z-inputnumber>
</ng-template>

<ng-template #weightPerUnitColTemplate let-row let-rowIndex="index">
  <z-inputnumber [group]="getProductList(row.__boxIndex).at(rowIndex)" [control]="'WeightPerUnit'"
    (onChange)="onChange_WeightPerUnit(row.__boxIndex)"
    [label]="formConfig.BoxList.items.ProductList.items.WeightPerUnit.label"
    [validationMessage]="formConfig.BoxList.items.ProductList.items.WeightPerUnit.error">
  </z-inputnumber>
</ng-template>

<ng-template #productActionColTemplate let-row let-rowIndex="index">
  <div class="tables-action-col">
    <button type="button" class="simple-btn simple-btn-icon" (click)="removeProductRow(row.__boxIndex, rowIndex)">
      <i class="pi pi-minus"></i>
    </button>
  </div>
</ng-template>
<!-- Packing List Box Related Templates End-->
