<!-- Index Table Component -->
<div class="col-xl-12 index-page-content">
    <z-datatable [tableDef]="tableDef" (lazyLoad)="onIndexTableLazyLoad($event)">
    </z-datatable>
</div>

<!-- Table Column Custom Template -->
<ng-template #salesEnquiryCodeTemplate let-row>
    <span class="table-action-link" (click)="onClickEditDetails(row.SalesEnquiryID)" style="cursor: pointer;">{{
        row.SalesEnquiryNo }}</span>
</ng-template>
