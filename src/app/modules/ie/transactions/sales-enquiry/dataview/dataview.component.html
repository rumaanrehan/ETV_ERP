<z-dataview [dataViewDef]="dataViewDef" (lazyLoad)="onIndexDataViewLazyLoad($event)"
    (resetFormEmitter)="onResetForm($event)" [itemTemplate]="customTemplate">
</z-dataview>

<ng-template #customTemplate let-salesEnquiry>
    <div class="se-cards-grid">
        <div class="se-card" *ngFor="let item of salesEnquiry" [class.is-selected]="item._selected">
            <div class="se-card__body">
                <div class="se-card__top">
                    <p-checkbox binary="true" [(ngModel)]="item._selected" (onChange)="onSelectionChange(item)">
                    </p-checkbox>

                    <div class="se-card__main">
                        <div class="se-card__head">
                            <div class="se-card__titles">
                                <a class="se-card__title-link" (click)="onClickEditDetails(item.SalesEnquiryID)">
                                    <h3 class="se-card__title">{{item.SalesEnquiryNo}}</h3>
                                </a>
                                <p class="se-card__subtitle">{{item.CustomerName}}</p>
                            </div>
                            <span class="se-badge" [ngClass]="getStatusBadgeClass(item.StatusText)">
                                {{item.StatusText}}
                            </span>
                        </div>
                    </div>
                </div>

                <div class="se-info">
                    <div class="se-info-row">
                        <i class="pi pi-calendar se-info-icon" aria-hidden="true"></i>
                        <div class="se-info-text">
                            <p class="se-info-label">Enquiry Date</p>
                            <p class="se-info-value">{{formatCardDate(item.EnquiryDate)}}</p>
                        </div>
                    </div>

                    <div class="se-info-row">
                        <i class="pi pi-clock se-info-icon" aria-hidden="true"></i>
                        <div class="se-info-text">
                            <p class="se-info-label">Expected Delivery</p>
                            <p class="se-info-value">{{formatCardDate(item.ExpectedDeliveryDate)}}</p>
                        </div>
                    </div>
                </div>

                <div class="se-contact">
                    <div class="se-contact-row">
                        <i class="pi pi-user se-info-icon" aria-hidden="true"></i>
                        <p class="se-contact-name">{{item.ContactName}}</p>
                    </div>
                    <div class="se-contact-row">
                        <i class="pi pi-envelope se-info-icon" aria-hidden="true"></i>
                        <p class="se-contact-email">{{item.ContactEmail}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ng-template>

<ng-template #container></ng-template>
