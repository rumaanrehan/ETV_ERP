<!--Page Header Action Button Template-->
<ng-template #pageHeaderActionTemplate>
    <button class="btn btn-primary btn-page-header" (click)="onClickPageHeaderAddButton()"> <i
            class="pi pi-plus"></i>&nbsp; Sales Enquiry</button>
</ng-template>

<div class="col-xl-12 index-page-content">
    <z-data-view [dataViewDef]="dataViewDef" (lazyLoad)="onIndexDataViewLazyLoad($event)"
        [itemTemplate]="customTemplate" [sortFieldList]="sortFieldList">

        <div sidebarContent>
            <form class="form-sidebar" [formGroup]="filterForm">
                <div class="col-xl-12 form-group">
                    <z-inputtext [group]="filterForm" [control]="'EnquiryNo'"
                        [label]="filterFormConfig.EnquiryNo.label"></z-inputtext>
                </div>
                <div class="col-xl-12 form-group">
                    <z-inputtext [group]="filterForm" [control]="'CustomerName'"
                        [label]="filterFormConfig.CustomerName.label"></z-inputtext>
                </div>
                <div class="col-xl-12 form-group">
                    <z-select [group]="filterForm" [control]="'EnquiryID'" [label]="filterFormConfig.EnquiryNo.label"
                        [options]="statusList" [optionLabel]="'Text'" [optionValue]="'iValue'"></z-select>
                </div>
                <div class="col-xl-12 form-group">
                    <z-select [group]="filterForm" [control]="'StatusID'" [label]="filterFormConfig.StatusID.label"
                        [options]="statusList" [optionLabel]="'Text'" [optionValue]="'iValue'"></z-select>
                </div>
            </form>
        </div>
    </z-data-view>
</div>

<ng-template #customTemplate let-SalesEnquiry>
    <div class="col-12 border rounded my-2" *ngFor="let item of SalesEnquiry; let first = first">
        <div class="col-12 p-3">
            <div class="d-flex justify-content-between">
                <a (click)="onClickEditDetails(item.EnquiryID)">
                    <h5 class="text-primary mb-2">{{item.EnquiryNo}} | {{item.CompanyName}}</h5>
                </a>
                <div class="text-end">
                    <span class="badge bg-outline-primary">{{populateStatus(item.StatusID)}}</span>
                </div>
            </div>
            <div class="col-12">
                <div class="col-xl-12">
                    <div class="d-flex flex-column flex-lg-row align-items-center mb-2">
                        <div class="col-xl-4 d-flex align-items-center">
                            <div class="col-xl-4">
                                <span class="fs-6 text-secondary">Enquiry Date:</span>
                            </div>
                            <div class="col-xl-6">
                                <span class="fs-6 text-secondary"> {{formatDate(item.EnquiryDate)}} </span>
                            </div>
                        </div>
                        <div class="col-xl-6">  </div>
                        <div class="col-2" *ngIf="item.StatusID == 1">
                            <button class="btn btn-primary" (click)="onClickCancel(item)">Cancel</button>
                        </div>
                    </div>

                    <!-- 🔹 Added Fields Start -->
                    <div class="d-flex flex-column flex-lg-row align-items-center mb-2">
                        <div class="col-xl-4 d-flex align-items-center">
                            <div class="col-xl-6">
                                <span class="fs-6 text-secondary">Contact Person Name:</span>
                            </div>
                            <div class="col-xl-6">
                                <span class="fs-6 text-secondary">{{item.ContactPersonName}}</span>
                            </div>
                        </div>
                        <div class="col-xl-4 d-flex align-items-center">
                            <div class="col-xl-6">
                                <span class="fs-6 text-secondary">Contact Person Email:</span>
                            </div>
                            <div class="col-xl-6">
                                <span class="fs-6 text-secondary">{{item.Email}}</span>
                            </div>
                        </div>
                    </div>
                        <div class="col-xl-4 d-flex align-items-center">
                            <div class="col-xl-6">
                                <span class="fs-6 text-secondary">Expected Delivery Date:</span>
                            </div>
                            <div class="col-xl-6">
                                <span class="fs-6 text-secondary">{{formatDate(item.ExpectedDeliveryDate)}}</span>
                            </div>
                        </div>
                    </div>
                    <!-- 🔹 Added Fields End -->

                </div>
            </div>
        </div>
</ng-template>


<ng-template #container></ng-template>
