<ng-template #pageHeaderActionTemplate>
  <button class="btn btn-primary btn-page-header" (click)="onClickPageHeaderBackButton()">
    <i class="pi pi-arrow-left"></i>&nbsp;Back</button>
</ng-template>

<div class="col-xl-12">
  <div class="col-xl-12 page-content">
    <div class="col-xl-12 page-content-scrollable">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="col-xl-12 card m-auto mb-2">
          <div class="card-body">
            <div class="horizontal-form">
              <div class="row"> <!-- Customer Details -->
                <div class="col-xl-3 form-group px-2">
                  <z-autocomplete [controlDef]="companyMasterAutoCompleteDef" (onSearch)="loadCompany($event)"
                    (onSelect)="OnCustomerSelect($event)" (onClear)="onClear_Company()"></z-autocomplete>
                </div>
                <div class="col-xl-2 form-group px-2">
                  <z-datepicker [group]="form" [control]="'EnquiryDate'" [label]="formConfig.EnquiryDate.label"
                    [validationMessage]="formConfig.EnquiryDate.error"></z-datepicker>
                </div>
                <div class="col-xl-4"></div>
                <div class="col-xl-2 form-group px-2">
                  <z-inputtext [group]="form" [control]="'ContactPersonName'" [label]="formConfig.ContactPersonName.label"
                    [validationMessage]="formConfig.ContactPersonName.error"></z-inputtext>
                </div>
                <div class="col-xl-2 form-group px-2">
                  <z-inputtext [group]="form" [control]="'Email'" [label]="formConfig.Email.label"
                    [validationMessage]="formConfig.Email.error"></z-inputtext>
                </div>
                <div class="col-xl-2 form-group px-2">
                  <z-inputtext [group]="form" [control]="'Phone'" [label]="formConfig.Phone.label"
                    [validationMessage]="formConfig.Phone.error"></z-inputtext>
                </div>
                <div class="col-xl-2 form-group px-2">
                  <z-datepicker [group]="form" [control]="'ExpectedDeliveryDate'" [label]="formConfig.ExpectedDeliveryDate.label"
                    [validationMessage]="formConfig.ExpectedDeliveryDate.error"></z-datepicker>
                </div>
                <div class="col-xl-4 form-group px-2">
                  <z-textarea [group]="form" [control]="'Note'" [label]="formConfig.Note.label"
                    [validationMessage]="formConfig.Note.error"></z-textarea>
                </div>

                

               
                <div class="col-xl-9"></div>
                <div class="col-xl-12 form-group px-2">
                  <z-span [text]="selectedCustomerAddress ?? ''"></z-span>
                </div>
                <!-- Product List -->
                <div class="col-12 px-2">
                  <h6 class="form-group">Product List</h6>
                  <div class="col-xl-3 form-group">
                    <z-autocomplete [controlDef]="productAutoCompleteDef" (onSearch)="onSearch_Product($event)"
                      (onSelect)="onSelect_Product($event)"></z-autocomplete>
                  </div>
                  <z-table [tableDef]="this.tableDef">
                  </z-table>
                </div>
                
  <div class="page-action-panel">
    <div class="col-xl-4"></div><div class="col-xl-4">
      <div class="status-pill" [ngStyle]="{ 'background-color': getStatus(form.get('StatusID')?.value)?.cValue }" *ngIf="isEditMode">
        <span>Status: {{ getStatus(form.get('StatusID')?.value)?.Text }}</span>
      </div>
    </div>
    <div class="col-xl-4">
      <div class="col-xl-3 px-1">
        <button type="submit" class="btn btn-md btn-primary w-100" (click)="onSubmit()"> {{ isEditMode ? "Update" :
          "Save" }} </button>
      </div>
      <div class="col-xl-3 px-1">
        <button type="submit" class="btn btn-md btn-primary w-100" (click)="resetForm()"> Reset </button>
      </div>
    </div>
  </div>
</div>

<ng-template #serialNoColTemplate let-row let-i="index">
  {{i + 1}}
</ng-template>

<ng-template #requestedQtyColTemplate let-row let-i="index">
  <z-inputnumber [group]="productListArray.at(i)" [control]="'RequestedQty'"
    [label]="formConfig.ProductList.items.RequestedQty.label"
    [validationMessage]="formConfig.ProductList.items.RequestedQty.error?.[i]" >
  </z-inputnumber>
</ng-template>

<ng-template #remarkColTemplate let-row let-i="index">
  <z-inputtext [group]="productListArray.at(i)" [control]="'Remark'"
    [label]="formConfig.ProductList.items.Remark.label"
    [validationMessage]="formConfig.ProductList.items.Remark.error?.[i]">
  </z-inputtext>
</ng-template>
