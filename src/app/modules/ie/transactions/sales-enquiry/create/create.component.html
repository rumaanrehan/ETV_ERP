<ng-template #pageHeaderActionTemplate>
</ng-template>

<div class="sales-enquiry-create" [class.is-edit-mode]="isEditMode">
  <div class="create-header">
    <div class="create-header-left">
      <button class="toolbar-btn icon-btn back-btn" type="button" (click)="onClickPageHeaderBackButton()"
        aria-label="Back" title="Back">
        <i class="pi pi-angle-left" aria-hidden="true"></i>
        <span class="visually-hidden">Back</span>
      </button>
      <div class="create-title">
        <div class="create-title-eyebrow">
          <!-- <span>Sales Enquiry</span> -->
          <div class="create-title-main">{{ isEditMode ? 'Edit' : 'Create' }} Sales Enquiry</div>
          <div class="status-pill" *ngIf="isEditMode && statusText" [style.backgroundColor]="getStatusPillBackground()"
            [style.color]="getStatusPillTextColor()">
            <span>{{statusText}}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="create-header-right">
      <div class="toolbar">
        <button type="button" class="toolbar-btn" [disabled]="isEditMode" (click)="resetForm()">
          <span>Reset</span>
        </button>

        <button type="button" class="toolbar-btn is-active" [disabled]="statusText != null && statusText != 'Received'"
          (click)="onSubmit()">
          <span>{{ isEditMode ? "Update" : "Save" }}</span>
        </button>

        <button type="button" class="toolbar-btn"
          *ngIf="isEditMode && !isQuotationAlreadyExists && statusText == 'Received'"
          (click)="onClickNavigateToSalesQuotation(this.form.get('SalesEnquiryID')?.value || null)">
          <span>Add Quotation</span>
        </button>

        <button type="button" class="toolbar-btn" *ngIf="isEditMode" [disabled]="disablePrintButton"
          (click)="printSalesEnquiry()">
          <span class="spinner-border spinner-border-sm me-2" *ngIf="disablePrintButton" aria-hidden="true"></span>
          <span>Print Sales Enquiry</span>
        </button>
      </div>
    </div>
  </div>

  <form class="create-form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
    <div class="simple-form">
      <div class="simple-field">
        <label class="simple-label">{{formConfig.CustomerID.label}}:</label>
        <div class="simple-control customer-control">
          <div class="customer-control-row">
            <z-autocomplete class="customer-autocomplete" [controlDef]="companyMasterAutoCompleteDef"
              [isClearable]="!isEditMode" (onSearch)="loadCustomer($event)" (onSelect)="onSelect_Customer($event)"
              (onClear)="onClear_Customer()">
            </z-autocomplete>
            <button *ngIf="!isEditMode" type="button" class="simple-action-btn customer-plus-btn"
              title="Add New Company" (click)="handleComponentLoad('VendorCreateComponent')">
              <i class="pi pi-plus" aria-hidden="true"></i>
              <!-- <span>Add</span> -->
            </button>
          </div>
        </div>
      </div>

      <div class="simple-field">
        <label class="simple-label">{{ isEditMode ? 'Address' : 'Billing Address' }}:</label>
        <div class="simple-control">
          <div class="simple-static">{{ selectedCustomerAddress ?? '—' }}</div>
        </div>
      </div>

      <div class="simple-field">
        <label class="simple-label">{{formConfig.SalesEnquiryNo.label}}:</label>
        <div class="simple-control">
          <div class="simple-static">{{ form.get('SalesEnquiryNo')?.value ?? 'Auto-generated' }}</div>
        </div>
      </div>

      <div class="simple-field">
        <label class="simple-label">{{formConfig.EnquiryDate.label}}:</label>
        <div class="simple-control">
          <z-datepicker [group]="form" [control]="'EnquiryDate'" [label]="''" [placeholder]="'dd-mm-yyyy'"
            [validationMessage]="formConfig.EnquiryDate.error">
          </z-datepicker>
        </div>
      </div>

      <div class="simple-field">
        <label class="simple-label">{{formConfig.ExpectedDeliveryDate.label}}:</label>
        <div class="simple-control">
          <z-datepicker [group]="form" [control]="'ExpectedDeliveryDate'" [label]="''" [placeholder]="'dd-mm-yyyy'"
            [validationMessage]="formConfig.ExpectedDeliveryDate.error">
          </z-datepicker>
        </div>
      </div>

      <div class="simple-field simple-field-table">
        <div class="simple-control">
          <z-table [tableDef]="this.tableDef"></z-table>
        </div>
      </div>

      <div class="table-add-row">
        <button type="button" class="simple-btn" (click)="addProductRow()">
          <i class="pi pi-plus" aria-hidden="true"></i>
          <span>Add line</span>
        </button>
      </div>

      <div class="simple-field">
        <label class="simple-label">{{formConfig.Note.label}}:</label>
        <div class="simple-control">
          <z-textarea [group]="form" [control]="'Note'" [autoResize]="true" [rows]="1" [label]="''"
            [placeholder]="'Optional'" [validationMessage]="formConfig.Note.error"></z-textarea>
        </div>
      </div>
    </div>
  </form>
</div>

<ng-template #serialNoColTemplate let-row let-i="index">
  {{i + 1}}
</ng-template>

<ng-template #productAutoCompleteColTemplate let-row let-rowIndex="index">
  <div class="action-input-group">
    <div class="product-input-wrap">
      <z-autocomplete [controlDef]="productAutoCompleteDef[rowIndex]" (onSearch)="onSearch_Product($event, rowIndex)"
        (onSelect)="onSelect_Product($event, rowIndex)" (onClear)="OnClear_Product(rowIndex)">
      </z-autocomplete>
    </div>
    <button type="button" class="inline-add-btn" title="Add New Product"
      *ngIf="rowIndex === this.productListArray.length - 1" (click)="handleComponentLoad('ProductCreateComponent')">
      <i class="pi pi-plus" aria-hidden="true"></i>
      <!-- <span>Add</span> -->
    </button>
  </div>
</ng-template>

<ng-template #requestedQtyColTemplate let-row let-i="index">
  <z-inputnumber [group]="productListArray.at(i)" [control]="'RequestedQty'"
    [label]="formConfig.ProductList.items.RequestedQty.label"
    [validationMessage]="formConfig.ProductList.items.RequestedQty.error?.[i]">
  </z-inputnumber>
</ng-template>

<ng-template #remarkColTemplate let-row let-i="index">
  <z-inputtext [group]="productListArray.at(i)" [control]="'Remarks'"
    [label]="formConfig.ProductList.items.Remarks.label"
    [validationMessage]="formConfig.ProductList.items.Remarks.error?.[i]">
  </z-inputtext>
</ng-template>

<ng-template #actionColTemplate let-row let-rowIndex="index">
  <div class="col-12 tables-action-col">
    <button type="button" class="simple-btn simple-btn-icon" title="Remove line"
      (click)="onClickRemoveProductItem(rowIndex)">
      <i class="pi pi-minus" aria-hidden="true"></i>
    </button>
  </div>
</ng-template>

<ng-template #container></ng-template>
