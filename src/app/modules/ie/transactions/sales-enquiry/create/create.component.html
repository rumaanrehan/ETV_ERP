<ng-template #pageHeaderActionTemplate>
  <button class="btn btn-primary btn-page-header" (click)="onClickPageHeaderBackButton()">
    <i class="pi pi-arrow-left"></i>&nbsp;Back</button>
</ng-template>

<div class="col-xl-12">
  <div class="col-xl-12 page-content">
    <div class="col-xl-12 page-content-scrollable">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="col-xl-12 card m-auto mb-2">
          <div class="card-body">
            <div class="horizontal-form">
              <div class="row">
                <!-- Customer Details -->
                <div class="col-xl-2 form-group px-2">
                  <z-span [text]="form.get('SalesEnquiryNo')?.value" [label]="formConfig.SalesEnquiryNo.label"></z-span>
                </div>
                <div class="col-xl-2 form-group px-2">
                  <z-datepicker [group]="form" [control]="'EnquiryDate'" [label]="formConfig.EnquiryDate.label"
                    [validationMessage]="formConfig.EnquiryDate.error"></z-datepicker>
                </div>
                <div class="col-xl-6"></div>
                <div class="col-xl-2 form-group px-2">
                  <z-datepicker [group]="form" [control]="'ExpectedDeliveryDate'"
                    [label]="formConfig.ExpectedDeliveryDate.label"
                    [validationMessage]="formConfig.ExpectedDeliveryDate.error"></z-datepicker>
                </div>
                <div class="col-xl-3 form-group px-2">
                  <div class="action-input-group">
                    <z-autocomplete [controlDef]="companyMasterAutoCompleteDef" (onSearch)="loadCustomer($event)" 
                    (onSelect)="onSelect_Customer($event)" (onClear)="onClear_Customer()">
                    </z-autocomplete>
                    <i class="bi bi-plus-circle fs-5 z-text-primary" role="button" title="Add New Company" 
                      (click)="handleComponentLoad('VendorCreateComponent')"></i>
                  </div>
                </div>
                <div class="col-xl-3"></div>
                <div class="col-xl-2 form-group px-2">
                  <z-inputtext [group]="form" [control]="'ContactName'" [label]="formConfig.ContactName.label"
                    [validationMessage]="formConfig.ContactName.error"></z-inputtext>
                </div>
                <div class="col-xl-2 form-group px-2">
                  <z-inputtext [group]="form" [control]="'ContactEmail'" [label]="formConfig.ContactEmail.label"
                    [validationMessage]="formConfig.ContactEmail.error"></z-inputtext>
                </div>
                <div class="col-xl-2 form-group px-2">
                  <z-inputtext [group]="form" [control]="'ContactPhone'" [label]="formConfig.ContactPhone.label"
                    [validationMessage]="formConfig.ContactPhone.error"></z-inputtext>
                </div>
                <div class="col-xl-12 form-group px-2">
                  <z-span [text]="selectedCustomerAddress ?? ''"></z-span>
                </div>
                <!-- Product List -->
                <div class="col-12 px-2">
                  <h6 class="form-group">Product List</h6>
                  <div class="col-xl-3 form-group px-2">
                    <div class="action-input-group">
                      <z-autocomplete class="flex-grow-1" [controlDef]="productAutoCompleteDef" 
                      (onSearch)="onSearch_Product($event)" (onSelect)="onSelect_Product($event)">
                      </z-autocomplete>

                      <i class="bi bi-plus-circle fs-5 z-text-primary" role="button" 
                        title="Add New Product" (click)="handleComponentLoad('ProductCreateComponent')">
                      </i>
                    </div>
                  </div>
                  <z-table [tableDef]="this.tableDef">
                  </z-table>
                </div>
                <div class="col-xl-6 form-group px-2">
                  <z-textarea [group]="form" [control]="'Note'" [label]="formConfig.Note.label"
                    [validationMessage]="formConfig.Note.error"></z-textarea>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="page-action-panel">
    <div class="col-xl-4"></div>
    <div class="col-xl-4">
      <div class="status-pill" [ngStyle]="{'background-color': '#'+statusHex}" *ngIf="isEditMode">
        <span>Status: {{statusText}}</span>
      </div>
    </div>
    <div class="col-xl-4">
      <div class="col-xl-3 px-1">
        <button type="submit" class="btn btn-md btn-primary w-100"
          [disabled]="statusText != null && statusText != 'Received'" (click)="onSubmit()"> {{ isEditMode ?
          "Update" :
          "Save" }} </button>
      </div>
      <div class="col-xl-3 px-1">
        <button type="button" class="btn btn-md btn-primary w-100" [disabled]="isEditMode" (click)="resetForm()"> Reset
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #serialNoColTemplate let-row let-i="index">
  {{i + 1}}
</ng-template>

<ng-template #requestedQtyColTemplate let-row let-i="index">
  <z-inputnumber [group]="productListArray.at(i)" [control]="'RequestedQty'"
    [label]="formConfig.ProductList.items.RequestedQty.label"
    [validationMessage]="formConfig.ProductList.items.RequestedQty.error?.[i]">
  </z-inputnumber>
</ng-template>

<ng-template #remarkColTemplate let-row let-i="index">
  <z-inputtext [group]="productListArray.at(i)" [control]="'Remarks'"
    [label]="formConfig.ProductList.items.Remarks.label"
    [validationMessage]="formConfig.ProductList.items.Remarks.error?.[i]">
  </z-inputtext>
</ng-template>

<ng-template #removeProductItemColTemplate let-row let-i="index">
  <div class="d-flex justify-content-end">
    <span class="btn btn-icon btn-sm btn-danger-transparent btn-delete-reactivate"
      (click)="onClickRemoveProductItem(i)">
      <i class="pi pi-minus-circle"></i></span>
  </div>
</ng-template>

<ng-template #container></ng-template>
