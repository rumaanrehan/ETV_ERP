<!-- Index Table Component -->
<z-datatable [tableDef]="tableDef" (lazyLoad)="onIndexTableLazyLoad($event)" (resetFormEmitter)="onResetForm($event)">
</z-datatable>

<!-- Table Column Custom Template -->
<ng-template #selectionColTemplate let-row>
    <p-checkbox binary="true" [(ngModel)]="row._selected" (onChange)="onSelectionChange()">
    </p-checkbox>
</ng-template>

<ng-template #exportOrderCodeTemplate let-row>
    <a class="table-action-link text-decoration-none cursor-pointer" (click)="onClickEditDetails(row.ExportOrderID)">
        {{ row.ExportOrderNo }}
    </a>
</ng-template>

<ng-template #statusColTemplate let-row>
    <span class="grid-status-pill" [ngStyle]="{ backgroundColor: row.StatusHex || 'var(--primary-color)' }">
        {{ row.StatusText }}
    </span>
</ng-template>
