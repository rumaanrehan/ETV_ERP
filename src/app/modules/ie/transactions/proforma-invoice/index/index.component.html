<!-- Page Header Action Button Template -->
<ng-template #pageHeaderActionTemplate>
    <button class="btn btn-primary btn-page-header btn-md shadow-sm btn-add-proforma-invoice"
        (click)="onClickPageHeaderAddButton()">
        <i class="pi pi-plus"></i>&nbsp;Add Proforma Invoice
    </button>
</ng-template>

<!-- Index Table Component -->
<div class="col-xl-12 index-page-content">
    <z-datatable [tableDef]="tableDef" (lazyLoad)="onIndexTableLazyLoad($event)">
    </z-datatable>
</div>

<!-- Table Column Custom Template -->
<ng-template #proformaInvoiceCodeTemplate let-row>
    <span class="table-action-link" (click)="onClickEditDetails(row.ProformaInvoiceID)" style="cursor: pointer;">{{
        row.ProformaInvoiceNo }}</span>
</ng-template>

<ng-template #proformaInvoiceDateTemplate let-row>
    {{formatDate(row.ProformaInvoiceDate)}}
</ng-template>

<ng-template #subtotalAmountFCTemplate let-row>
    <span>{{row.CurrencySymbol}} {{row.SubtotalAmountFC | number:'1.2-2' }}</span>
</ng-template>

<ng-template #taxAmountFCTemplate let-row>
    <span>{{row.CurrencySymbol}} {{row.TaxAmountFC | number:'1.2-2' }}</span>
</ng-template>

<ng-template #netAmountFCTemplate let-row>
    <span>{{row.CurrencySymbol}} {{row.NetAmountFC | number:'1.2-2' }}</span>
</ng-template>

<ng-template #proformaInvoiceStatusTemplate let-row>
    <span class="table-row-status">
        <i class="pi pi-circle-fill" [style.color]="row.StatusHex"></i>
        {{ row.StatusText }}
    </span>
</ng-template>

<ng-template #actionColTemplate let-row>
    <div class="d-flex justify-content-end" *ngIf="row.StatusText == 'Draft'">
        <button type="button" class="inline-add-btn inline-add-btn-icon" title="Delete"
            (click)="onClickDeleteReactivate(row)">
            <i class="pi pi-times-circle" aria-hidden="true"></i>
        </button>
    </div>
</ng-template>
