<!-- Page Header Action Button Template -->
<ng-template #pageHeaderActionTemplate>
    <button class="btn btn-primary btn-page-header" (click)="onClickPageHeaderAddButton()"><i class="pi pi-plus"></i>&nbsp;Add ImportOrder</button>
</ng-template>

<!-- Index Table Component -->
<div class="col-xl-12 index-page-content">
  <z-datatable [tableDef]="tableDef"
    (lazyLoad)="onIndexTableLazyLoad($event)">
  </z-datatable>
</div>

<!-- Table Column Custom Template -->
 <ng-template #importOrderTemplate let-row>
    <span class="table-action-link" (click)="onClickEditDetails(row.ImportOrderDocumentID, row.ActiveStatus)" style="cursor: pointer;">{{ row.ImportOrderDocumentID }}</span>
</ng-template>

<ng-template #statusTemplate let-row>
    <span class="table-row-status">
        <i class="pi pi-circle-fill text-{{ row.IsDeleted ? 'danger' : 'success' }}"></i>
        {{ row.IsDeleted ? 'Inactive'  : 'Active' }}
    </span>
</ng-template>

<ng-template #actionColTemplate let-row>
    <div class="d-flex justify-content-end">
        <span class="btn btn-icon btn-sm btn-{{row.IsDeleted ? 'success' : 'danger'}}-transparent btn-delete-reactivate" (click)="onClickDeleteReactivate(row)"><i class="pi pi-{{row.IsDeleted ? 'undo' : 'trash'}}"></i></span>
    </div>
</ng-template>

<app-create (closeSidebarEvent)="onCloseSidebar()"></app-create>
