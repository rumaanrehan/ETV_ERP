<ng-template #pageHeaderActionTemplate>
    <button class="btn btn-primary btn-page-header" (click)="onClickPageHeaderBackButton()">
        <i class="pi pi-arrow-left"></i>&nbsp;Back</button>
</ng-template>

<div class="col-xl-12">
    <div class="col-xl-12 page-content">
        <div class="col-xl-12 page-content-scrollable">
            <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
                <div class="col-xl-12 card m-auto mb-2">
                    <div class="card-body">
                        <div class="horizontal-form">
                            <div class="row">
                                <div class="col-xl-2 form-group px-2">
                                    <z-span [text]="form.get('TaxInvoiceNo')?.value"
                                        [label]="formConfig.TaxInvoiceNo.label"></z-span>
                                </div>
                                <div class="col-xl-2 form-group px-2">
                                    <z-select [group]="form" [control]="'BasedOn'" [label]="formConfig.BasedOn.label"
                                        [validationMessage]="formConfig.BasedOn.error"
                                        [optionLabel]="'Text'" [optionValue]="'iValue'" [options]="basedOnList"
                                        [readonly]="isEditMode" (onChange)="onBasedOnChange()"></z-select>
                                </div>
                                <div class="col-xl-6 form-group px-2"></div>
                                <div class="col-xl-2 form-group px-2">
                                    <z-datepicker [group]="form" [control]="'TaxInvoiceDate'"
                                        [label]="formConfig.TaxInvoiceDate.label" [validationMessage]="formConfig.TaxInvoiceDate.error"
                                        [validationMessage]="formConfig.TaxInvoiceDate.error"></z-datepicker>
                                </div>
                                <div class="col-xl-3 form-group px-2" *ngIf="isBasedOnDocument">
                                    <z-autocomplete [controlDef]="documentAutoCompleteDef"
                                        (onSearch)="loadDocument($event)" (onSelect)="onSelect_Document($event)"
                                        (onClear)="onClear_Document()"></z-autocomplete>
                                </div>
                                <div class="col-xl-3 form-group px-2">
                                    <z-autocomplete [controlDef]="companyMasterAutoCompleteDef"
                                        (onSearch)="loadCompany($event)" (onSelect)="onSelect_Company($event)"
                                        (onClear)="onClear_Company()"></z-autocomplete>
                                </div>
                                <div class="col-xl-6"></div>
                                <div class="col-xl-6 form-group px-2">
                                    <z-span [text]="selectedCustomerAddress"></z-span>
                                </div>
                                <div class="col-xl-9"></div>
                                <h6 class="form-group px-2">Exchange Rate Details</h6>
                                <div class="col-xl-2 form-group px-2">
                                    <z-select [group]="form" [control]="'FCCurrencyID'"
                                        [label]="formConfig.FCCurrencyID.label"
                                        [validationMessage]="formConfig.FCCurrencyID.error" [optionLabel]="'CurrencyName'"
                                        [optionValue]="'CurrencyID'" [options]="currencyList"
                                        [readonly]="isBasedOnDocument"></z-select>
                                </div>
                                <div class=" col-xl-6">
                                </div>
                                <div class="col-xl-2 form-group px-2">
                                    <z-datepicker [group]="form" [control]="'ExchangeRateDate'"
                                        [label]="formConfig.ExchangeRateDate.label" [validationMessage]="formConfig.ExchangeRateDate.error"
                                        [readonly]="isBasedOnDocument"></z-datepicker>
                                </div>
                                <div class="col-xl-2 form-group px-2">
                                    <z-inputnumber [group]="form" [control]="'ExchangeRateToBC'"
                                        [label]="formConfig.ExchangeRateToBC.label" [validationMessage]="formConfig.ExchangeRateToBC.error" (onChange)="productCalculation()"
                                        [readonly]="isBasedOnDocument"></z-inputnumber>
                                </div>

                                <div class="col-md-2 form-group px-2">
                                    <z-inputnumber [group]="form" [control]="'InsuranceAmountFC'"
                                        [label]="formConfig.InsuranceAmountFC.label" [validationMessage]="formConfig.InsuranceAmountFC.error"
                                        [readonly]="isBasedOnDocument"></z-inputnumber>
                                </div>
                                <div class="col-xl-6"></div>
                                <div class="col-md-2 form-group px-2">
                                    <z-inputnumber [group]="form" [control]="'FreightChargeFC'"
                                        [label]="formConfig.FreightChargeFC.label" [validationMessage]="formConfig.FreightChargeFC.error"
                                        [readonly]="isBasedOnDocument" (onChange)="productCalculation()"></z-inputnumber>
                                </div>
                                <div class="col-md-2 form-group px-2">
                                    <z-inputnumber [group]="form" [control]="'BankChargesFC'"
                                        [label]="formConfig.BankChargesFC.label" [validationMessage]="formConfig.BankChargesFC.error"
                                        [readonly]="isBasedOnDocument" (onChange)="productCalculation()"></z-inputnumber>
                                </div>
                                <div class="col-xl-6"></div>
                                <div class="col-12 px-2">
                                    <div *ngIf="!isBasedOnDocument">
                                        <h6 class="form-group">Product List</h6>
                                        <div class="col-xl-3 form-group">
                                            <z-autocomplete [controlDef]="productAutoCompleteDef"
                                                (onSearch)="onSearch_Product($event)"
                                                (onSelect)="onSelect_Product($event)"></z-autocomplete>
                                        </div>
                                    </div>
                                    <z-table [tableDef]="this.tableDef">
                                    </z-table>
                                </div>
                                <div class="col-md-8 form-group px-2">
                                    <z-textarea [group]="form" [control]="'Narration'"
                                        [label]="formConfig.Narration.label" [validationMessage]="formConfig.Narration.error"></z-textarea>
                                </div>
                                <div class="col-12 px-2 d-flex flex-column align-items-end gap-2">
                                    <div class="col-12 col-xl-3">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <p class="mb-0">Subtotal Amount: </p>
                                            <z-inputnumber [group]="form" [control]="'SubtotalAmountFC'"
                                                [label]="formConfig.SubtotalAmountFC.label"
                                                [validationMessage]="formConfig.SubtotalAmountFC.error"
                                                [readonly]="true"></z-inputnumber>
                                        </div>
                                    </div>
                                    <div class="col-12 col-xl-3">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <p class="mb-0">Tax Amount: </p>
                                            <z-inputnumber [group]="form" [control]="'TaxAmountFC'"
                                                [label]="formConfig.TaxAmountFC.label"
                                                [validationMessage]="formConfig.TaxAmountFC.error"
                                                [readonly]="true"></z-inputnumber>
                                        </div>
                                    </div>
                                    <div class="col-12 col-xl-3">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <p class="mb-0">Net Amount: </p>
                                            <z-inputnumber [group]="form" [control]="'NetAmountFC'"
                                                [label]="formConfig.NetAmountFC.label"
                                                [validationMessage]="formConfig.NetAmountFC.error"
                                                [readonly]="true"></z-inputnumber>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="page-action-panel">
        <div class="col-xl-4"></div>
        <div class="col-xl-4">
            <div class="status-pill" [ngStyle]="{'background-color': form.get('StatusID')?.value === 1 ? 'green' : 'red'}" *ngIf="isEditMode">
                <span>Status: {{ form.get('StatusID')?.value === 1 ? 'Processing' : 'Cancelled' }}</span>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="col-xl-3 px-1">
                <button type="submit" class="btn btn-md btn-primary w-100"
                    [disabled]="(form.get('BasedOn')?.value == 1 && isEditMode) || form.get('StatusID')?.value !== 1"
                    (click)="onSubmit()"> {{ isEditMode ? "Update" : "Save" }} 
                </button>
            </div>
            <div class="col-xl-3 px-1">
                <button type="submit" class="btn btn-md btn-primary w-100"
                    [disabled]="(form.get('BasedOn')?.value == 1 && isEditMode)" (click)=" resetForm()">Reset</button>
            </div>
        </div>
    </div>
</div>

<!-- Export Order Item Table Related Templates Start-->
<ng-template #serialNoColTemplate let-row let-i="index">
    {{i + 1}}
</ng-template>

<ng-template #salesQtyColTemplate let-row let-i="index">
    <z-inputnumber [group]="productListArray.at(i)" [control]="'SalesQty'"
        [label]="formConfig.ProductList.items.SalesQty.label"
        [validationMessage]="formConfig.ProductList.items.SalesQty.error?.[i]" [readonly]="isBasedOnDocument"
        (onChange)="productCalculation()">
    </z-inputnumber>
</ng-template>

<ng-template #ratePerUnitFCColTemplate let-row let-i="index">
    <div class="input-group">
        <z-inputnumber [group]="productListArray.at(i)" [control]="'RatePerUnitFC'"
            [label]="formConfig.ProductList.items.RatePerUnitFC.label"
            [validationMessage]="formConfig.ProductList.items.RatePerUnitFC.error?.[i]" [styleClass]="'text-end'"
            [readonly]="isBasedOnDocument" (onChange)="productCalculation()"></z-inputnumber>
    </div>
</ng-template>

<ng-template #taxRateColTemplate let-row let-i="index">
    <z-select [group]="productListArray.at(i)" [control]="'SalesTaxRate'"
        [label]="formConfig.ProductList.items.SalesTaxRate.label"
        [validationMessage]="formConfig.ProductList.items.SalesTaxRate.error?.[i]" [options]="taxSlabList"
        [optionLabel]="'TaxSlabName'" [optionValue]="'TaxRate'" [readonly]="isBasedOnDocument"
        (onChange)="productCalculation();">
    </z-select>
</ng-template>

<ng-template #taxableAmountFCColTemplate let-row let-i="index">
    <div class="input-group">
        <z-inputnumber [group]="productListArray.at(i)" [control]="'TaxableAmountFC'"
            [label]="formConfig.ProductList.items.TaxableAmountFC.label"
            [validationMessage]="formConfig.ProductList.items.TaxableAmountFC.error?.[i]" [styleClass]="'text-end'"
            [readonly]="isBasedOnDocument"></z-inputnumber>
    </div>
</ng-template>

<ng-template #taxAmountFCColTemplate let-row let-i="index">
    <div class="input-group">
        <z-inputnumber [group]="productListArray.at(i)" [control]="'TaxAmountFC'"
            [label]="formConfig.ProductList.items.TaxAmountFC.label"
            [validationMessage]="formConfig.ProductList.items.TaxAmountFC.error?.[i]" [styleClass]="'text-end'"
            [readonly]="isBasedOnDocument"></z-inputnumber>
    </div>
</ng-template>

<ng-template #removeProductItemColTemplate let-row let-i="index">
    <div class="d-flex justify-content-end" *ngIf="!isBasedOnDocument">
        <span class="btn btn-icon btn-sm btn-danger-transparent btn-delete-reactivate"
            (click)="onClickRemoveProductItem(i)">
            <i class="pi pi-minus-circle"></i></span>
    </div>
</ng-template>
